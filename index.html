<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pack Draft Slot Machine</title>
  <style>
    :root{
      --bg1:#0b1020;
      --bg2:#111827;
      --panel:rgba(17,24,39,.88);
      --text:#f8fafc;
      --muted:rgba(255,255,255,.72);
      --gold:#f7d77a;
      --shadow:0 18px 40px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Segoe UI,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top, rgba(94,111,255,.22), transparent 28%),
        radial-gradient(circle at 20% 20%, rgba(250,204,21,.09), transparent 20%),
        linear-gradient(180deg,var(--bg2),var(--bg1));
      min-height:100vh;
    }
    .app{width:min(1120px,calc(100% - 20px)); margin:0 auto; padding:22px 0 40px}
    .topbar{text-align:center; margin-bottom:18px}
    .tag{
      display:inline-block; padding:6px 12px; border-radius:999px;
      background:rgba(247,215,122,.08); border:1px solid rgba(247,215,122,.26);
      color:var(--gold); text-transform:uppercase; letter-spacing:.08em; font-size:.8rem;
    }
    h1{margin:12px 0 8px; font-size:clamp(2rem,4vw,3.25rem)}
    .topbar p{margin:0; color:var(--muted)}
    .controls{
      display:grid; grid-template-columns:120px 1fr; gap:14px;
      background:var(--panel); border:1px solid rgba(255,255,255,.08);
      border-radius:18px; padding:16px; box-shadow:var(--shadow); margin-bottom:18px;
      backdrop-filter: blur(10px);
    }
    .controls label{display:flex; flex-direction:column; gap:8px; color:var(--muted); font-size:.9rem}
    .controls input,.controls textarea{
      width:100%; border:1px solid rgba(255,255,255,.08); background:rgba(255,255,255,.05);
      color:white; border-radius:12px; padding:12px 14px; font:inherit; resize:vertical;
    }
    .button-row{grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:10px}
    .btn{
      border:none; border-radius:12px; padding:12px 18px; font-weight:800; cursor:pointer;
      transition:transform .18s ease, opacity .18s ease, box-shadow .18s ease;
    }
    .btn:hover{transform:translateY(-1px)}
    .btn:disabled{cursor:not-allowed; opacity:.55; transform:none}
    .btn.primary{background:linear-gradient(135deg,#f7d77a,#d6aa47); color:#1a1407}
    .btn.secondary{background:rgba(255,255,255,.08); color:white}
    .btn.danger{background:#ef4444; color:white}
    .arena{display:grid; gap:14px; justify-items:center; margin-bottom:18px}
    .slot-shell{
      position:relative; width:100%; overflow:hidden; border-radius:18px;
      border:2px solid rgba(247,215,122,.22);
      background:linear-gradient(180deg, rgba(8,12,20,.96), rgba(4,6,10,.98));
      box-shadow:inset 0 0 32px rgba(0,0,0,.75), 0 16px 36px rgba(0,0,0,.35);
      padding:14px 0;
    }
    .slot-window{
      position:relative; width:min(860px,100%); height:182px; margin:0 auto; overflow:hidden;
      border-top:2px solid rgba(255,255,255,.06); border-bottom:2px solid rgba(255,255,255,.06);
    }
    .slot-window::before,.slot-window::after{
      content:""; position:absolute; top:0; bottom:0; width:80px; z-index:3; pointer-events:none;
    }
    .slot-window::before{left:0; background:linear-gradient(90deg, rgba(4,6,10,1), rgba(4,6,10,0))}
    .slot-window::after{right:0; background:linear-gradient(270deg, rgba(4,6,10,1), rgba(4,6,10,0))}
    .center-line{
      position:absolute; left:50%; top:0; transform:translateX(-50%); width:182px; height:100%;
      border-left:2px dashed rgba(255,100,100,.34); border-right:2px dashed rgba(255,100,100,.34);
      background:rgba(255,255,255,.02); z-index:2; pointer-events:none;
    }
    .reel-track{
      display:flex; align-items:center; gap:14px; padding:20px 46px;
      transform:translateX(0); will-change:transform;
    }
    .reel-card{
      width:180px; height:138px; border-radius:18px; padding:12px 12px 10px;
      flex:0 0 auto; position:relative; overflow:hidden;
      border:2px solid rgba(255,255,255,.14); box-shadow:0 10px 20px rgba(0,0,0,.3);
      transform:scale(.965); transition:transform .18s ease, filter .18s ease;
    }
    .reel-card.active{transform:scale(1.08); filter:brightness(1.12) saturate(1.08)}
    .reel-card .rarity{
      position:absolute; top:10px; right:10px; font-size:.66rem; font-weight:900;
      letter-spacing:.12em; text-transform:uppercase; padding:5px 8px; border-radius:999px;
      background:rgba(0,0,0,.24); color:white;
    }
    .reel-card .rating{font-size:2.7rem; font-weight:900; line-height:1; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,.35)}
    .reel-card .name{margin-top:8px; font-size:1rem; font-weight:900; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    .reel-card .pos{margin-top:4px; font-size:.78rem; opacity:.9; letter-spacing:.04em}
    .result{
      width:100%; text-align:center; padding:14px 16px; border-radius:16px;
      border:1px solid rgba(255,255,255,.08); background:rgba(255,255,255,.05);
      color:var(--gold); font-weight:800;
    }
    .card-zone{display:grid; place-items:center; margin-bottom:18px}
    .player-card{
      position:relative; width:min(360px,94vw); aspect-ratio:.72 / 1; border-radius:30px;
      overflow:hidden; border:3px solid rgba(255,255,255,.15); padding:18px;
      transform-style:preserve-3d; transition:transform .25s ease, box-shadow .25s ease;
      animation:floatCard 4s ease-in-out infinite;
    }
    .player-card::before{
      content:""; position:absolute; inset:0;
      background:
        radial-gradient(circle at 20% 15%, rgba(255,255,255,.2), transparent 18%),
        radial-gradient(circle at 80% 20%, rgba(255,255,255,.12), transparent 18%),
        linear-gradient(135deg, rgba(255,255,255,.06), transparent 40%);
      pointer-events:none;
    }
    .card-top{display:flex; align-items:baseline; justify-content:space-between; z-index:1}
    .card-rating{font-size:clamp(4rem,11vw,5.5rem); font-weight:900; line-height:.9; color:var(--gold); text-shadow:0 2px 14px rgba(0,0,0,.35)}
    .card-pos{font-size:1.8rem; font-weight:900; letter-spacing:.06em; color:rgba(255,255,255,.95)}
    .card-art{
      position:relative; height:52%; margin:12px 0 10px; border-radius:22px; overflow:hidden;
      border:1px solid rgba(255,255,255,.1);
      background:radial-gradient(circle at 50% 20%, rgba(255,255,255,.16), transparent 28%), linear-gradient(135deg, #0f1633, #101b4d 45%, #06101f 100%);
    }
    .card-art::before,.card-art::after{
      content:""; position:absolute; inset:0;
      background:
        linear-gradient(135deg, transparent 35%, rgba(247,215,122,.25) 35%, rgba(247,215,122,.25) 38%, transparent 38%),
        linear-gradient(155deg, transparent 50%, rgba(247,215,122,.18) 50%, rgba(247,215,122,.18) 53%, transparent 53%);
      opacity:.8;
    }
    .card-glow{
      position:absolute; inset:-10%;
      background:
        radial-gradient(circle at 35% 45%, rgba(64,114,255,.7), transparent 28%),
        radial-gradient(circle at 70% 55%, rgba(255,214,102,.55), transparent 26%);
      filter:blur(12px); animation:glowMove 5s ease-in-out infinite;
    }
    .card-badge{
      position:absolute; top:12px; right:12px; padding:6px 10px; border-radius:999px;
      background:rgba(247,215,122,.16); border:1px solid rgba(247,215,122,.35);
      color:var(--gold); font-size:.75rem; font-weight:800; letter-spacing:.14em;
    }
    .card-name{z-index:1; text-align:center; font-size:1.7rem; font-weight:900; text-transform:uppercase; letter-spacing:.06em; margin-top:4px}
    .stats{z-index:1; display:grid; grid-template-columns:repeat(3,1fr); gap:10px 12px; margin-top:auto; padding-top:12px}
    .stats div{display:flex; flex-direction:column; gap:4px; align-items:center}
    .stats span{font-size:.8rem; color:rgba(255,255,255,.72); font-weight:700}
    .stats strong{font-size:2rem; color:white; line-height:1}
    .history{
      margin-top:20px; padding:16px; border-radius:18px; background:var(--panel);
      border:1px solid rgba(255,255,255,.08); backdrop-filter:blur(10px);
    }
    .history h2{margin:0 0 14px; color:var(--gold)}
    .history-grid{display:flex; flex-wrap:wrap; gap:12px; justify-content:center}
    .history-mini-card{
      width:112px; padding:10px 8px; border-radius:14px; border:2px solid rgba(255,255,255,.16);
      color:white; font-weight:800; box-shadow:0 8px 18px rgba(0,0,0,.3); animation:popIn .25s ease-out;
    }
    .history-mini-card .mini-card-rating{font-size:1.8rem; line-height:1; margin:4px 0}
    .history-mini-card .mini-card-name{font-size:.72rem; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    .history-mini-card .mini-card-pos{font-size:.68rem; opacity:.85}
    .skin-bronze{background:linear-gradient(135deg,#8b4b21,#4b240c) !important; box-shadow:0 0 28px rgba(139,75,33,.45)}
    .skin-silver{background:linear-gradient(135deg,#dbe4ef,#aeb9c8) !important; color:#18212f !important}
    .skin-gold{background:linear-gradient(135deg,#ffec8a,#c58a18) !important; box-shadow:0 0 30px rgba(247,215,122,.35)}
    .skin-tots{background:linear-gradient(135deg,#10163c,#1e4fd8,#0d8e83) !important; box-shadow:0 0 32px rgba(53,99,255,.55); animation:cardPulse 1.7s ease-in-out infinite, floatCard 4s ease-in-out infinite}
    .skin-futties{background:linear-gradient(135deg,#f43f8c,#c51f6b,#16b7d4) !important; box-shadow:0 0 38px rgba(244,63,140,.65); animation:cardPulse 1.2s ease-in-out infinite, floatCard 4s ease-in-out infinite}
    @keyframes floatCard{0%,100%{translate:0 0}50%{translate:0 -6px}}
    @keyframes cardPulse{0%,100%{filter:brightness(1); transform:scale(1)}50%{filter:brightness(1.08); transform:scale(1.01)}}
    @keyframes glowMove{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(6px,-8px,0) scale(1.05)}}
    @keyframes popIn{from{transform:scale(.85); opacity:0}to{transform:scale(1); opacity:1}}
    @media (max-width:760px){
      .controls{grid-template-columns:1fr}
      .button-row{flex-direction:column}
      .btn{width:100%}
      .slot-window{height:160px}
      .reel-card{width:155px; height:128px}
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="tag">Dynamic Pack Draft</div>
      <h1>Pack Spinner</h1>
      <p>Higher ratings = rarer, cooler cards.</p>
    </header>

    <section class="controls">
      <label>
        Position
        <input id="filter-pos" type="text" value="ST" maxlength="3" />
      </label>

      <label>
        Roster
        <textarea id="names" rows="5">Ethan (84 - RB), Reuben (84 - LB), Seb (90 - CB), Ari (97 - LW), James (92 - ST), Ben (92 - ST), Noah (91 - CM), Donny (92 - CM), Charlie (94 - ST), Flynn (90 - LM), Mason (96 - CAM), Louis (92 - RW), Hugo (91 - ST), Lachlan (91 - CB), Harry L (92 - CB), Martin (96 - CDM), Luke (92 - GK), Jack (95 - GK), Archie (90 - LB), CJ (100 - RB), Harry R (97 - CAM), George (90 - ST), Aidan (95 - RM), Fred (91 - CAM), Felix (93 - CDM)</textarea>
      </label>

      <div class="button-row">
        <button id="update-roster-btn" class="btn secondary">Update Roster</button>
        <button id="btn-spin" class="btn primary">Spin</button>
        <button id="clear-history-btn" class="btn danger">Reset History</button>
      </div>
    </section>

    <section class="arena">
      <div class="slot-shell">
        <div class="slot-window">
          <div class="center-line"></div>
          <div id="reel-track" class="reel-track"></div>
        </div>
      </div>

      <div class="result">
        <div id="result-text">Ready for pack selection</div>
      </div>
    </section>

    <section class="card-zone">
      <article id="display-card" class="player-card skin-silver">
        <div class="card-top">
          <div class="card-rating" id="card-rating">--</div>
          <div class="card-pos" id="card-pos">ST</div>
        </div>

        <div class="card-art">
          <div class="card-glow"></div>
          <div class="card-badge">DRAFT</div>
        </div>

        <div class="card-name" id="card-name">READY</div>

        <div class="stats">
          <div><span>VEL</span><strong id="stat-vel">99</strong></div>
          <div><span>TIR</span><strong id="stat-tir">99</strong></div>
          <div><span>PAS</span><strong id="stat-pas">99</strong></div>
          <div><span>DRI</span><strong id="stat-dri">99</strong></div>
          <div><span>DIF</span><strong id="stat-dif">99</strong></div>
          <div><span>FIS</span><strong id="stat-fis">99</strong></div>
        </div>
      </article>
    </section>

    <section class="history">
      <h2>Packed Squad History</h2>
      <div id="history-ledger" class="history-grid">
        <p id="history-fallback-msg">No players drafted yet. Press spin to build your squad!</p>
      </div>
    </section>
  </main>

  <script>
    const reelTrack = document.getElementById("reel-track");
    const resultText = document.getElementById("result-text");
    const spinBtn = document.getElementById("btn-spin");
    const displayCard = document.getElementById("display-card");
    const cardName = document.getElementById("card-name");
    const cardRating = document.getElementById("card-rating");
    const cardPos = document.getElementById("card-pos");
    const filterPosInput = document.getElementById("filter-pos");
    const historyLedger = document.getElementById("history-ledger");
    const namesInput = document.getElementById("names");
    const updateRosterBtn = document.getElementById("update-roster-btn");
    const clearHistoryBtn = document.getElementById("clear-history-btn");

    let items = [];
    let isSpinning = false;
    let currentOffset = 0;
    let animationId = null;

    const cardWidth = 194;
    const gap = 14;
    const step = cardWidth + gap;

    function parseRoster(text) {
      return text.split(",").map(x => x.trim()).filter(Boolean);
    }

    function getPlayerData(entry) {
      const match = entry.match(/^(.+?)\s*\((\d+)\s*-\s*([^)]+)\)$/);
      if (!match) return { name: entry, rating: "??", position: filterPosInput.value.toUpperCase(), rarity: "BRONZE" };
      const rating = parseInt(match[2], 10);
      return { name: match[1].trim(), rating: match[2].trim(), position: match[3].trim().toUpperCase(), rarity: getRarity(rating) };
    }

    function getRarity(rating) {
      if (rating >= 99) return "FUTTIES";
      if (rating >= 95) return "TOTS";
      if (rating >= 90) return "GOLD";
      if (rating >= 80) return "SILVER";
      return "BRONZE";
    }

    function getSkinClass(rarity) {
      return { BRONZE:"skin-bronze", SILVER:"skin-silver", GOLD:"skin-gold", TOTS:"skin-tots", FUTTIES:"skin-futties" }[rarity] || "skin-silver";
    }

    function buildReel() {
      reelTrack.innerHTML = "";
      if (!items.length) return;

      const repeat = 6;
      const reelItems = [];
      for (let r = 0; r < repeat; r++) reelItems.push(...items);

      reelItems.forEach((entry) => {
        const data = getPlayerData(entry);
        const card = document.createElement("div");
        card.className = `reel-card ${getSkinClass(data.rarity)}`;
        card.innerHTML = `
          <div class="rarity">${data.rarity}</div>
          <div class="rating">${data.rating}</div>
          <div class="name">${data.name}</div>
          <div class="pos">${data.position}</div>
        `;
        reelTrack.appendChild(card);
      });

      currentOffset = 0;
      reelTrack.style.transform = "translateX(0px)";
      highlightCenterCard();
    }

    function highlightCenterCard() {
      const cards = [...document.querySelectorAll(".reel-card")];
      if (!cards.length) return;

      const centerX = window.innerWidth / 2;
      let closest = null;
      let closestDist = Infinity;

      cards.forEach(card => card.classList.remove("active"));

      cards.forEach(card => {
        const rect = card.getBoundingClientRect();
        const cardCenter = rect.left + rect.width / 2;
        const dist = Math.abs(cardCenter - centerX);
        if (dist < closestDist) {
          closestDist = dist;
          closest = card;
        }
      });

      if (closest) closest.classList.add("active");
    }

    function applySkin(rating) {
      displayCard.classList.remove("skin-bronze", "skin-silver", "skin-gold", "skin-tots", "skin-futties");
      displayCard.classList.add(getSkinClass(getRarity(parseInt(rating, 10))));
    }

    function addPlayerToHistory(name, rating, position) {
      const fallback = document.getElementById("history-fallback-msg");
      if (fallback) fallback.remove();

      const mini = document.createElement("div");
      mini.className = `history-mini-card ${getSkinClass(getRarity(parseInt(rating, 10)))}`;
      mini.innerHTML = `
        <div class="mini-card-pos">${position}</div>
        <div class="mini-card-rating">${rating}</div>
        <div class="mini-card-name">${name}</div>
      `;
      historyLedger.insertBefore(mini, historyLedger.firstChild);
    }

    function setFinalCard(entry) {
      const data = getPlayerData(entry);
      cardName.textContent = data.name;
      cardRating.textContent = data.rating;
      cardPos.textContent = data.position;
      applySkin(data.rating);
      resultText.textContent = `Packed: ${data.name} (${data.rating} - ${data.position})`;
      addPlayerToHistory(data.name, data.rating, data.position);
    }

    function resetHistory() {
      historyLedger.innerHTML = `<p id="history-fallback-msg">No players drafted yet. Press spin to build your squad!</p>`;
    }

    function updateRoster() {
      if (isSpinning) return;
      items = parseRoster(namesInput.value);
      buildReel();
      resultText.textContent = "Roster updated.";
    }

    function spin() {
      if (isSpinning || items.length === 0) return;

      isSpinning = true;
      spinBtn.disabled = true;
      spinBtn.textContent = "Spinning...";
      resultText.textContent = "Opening pack...";

      const selectedIndex = Math.floor(Math.random() * items.length);
      const repeats = 3;
      const landingIndex = (repeats * items.length) + selectedIndex;
      const startX = currentOffset;
      const finishX = -(landingIndex * step) + (window.innerWidth / 2) - (cardWidth / 2);

      const duration = 4200;
      const startTime = performance.now();

      function easeOutQuint(t) {
        return 1 - Math.pow(1 - t, 5);
      }

      function animate(now) {
        const elapsed = now - startTime;
        const t = Math.min(1, elapsed / duration);
        const eased = easeOutQuint(t);

        currentOffset = startX + (finishX - startX) * eased;
        reelTrack.style.transform = `translateX(${currentOffset}px)`;

        highlightCenterCard();

        if (t < 1) {
          animationId = requestAnimationFrame(animate);
        } else {
          setFinalCard(items[selectedIndex]);
          isSpinning = false;
          spinBtn.disabled = false;
          spinBtn.textContent = "Spin";
          highlightCenterCard();
        }
      }

      if (animationId) cancelAnimationFrame(animationId);
      animationId = requestAnimationFrame(animate);
    }

    function syncPosition() {
      if (!isSpinning) cardPos.textContent = filterPosInput.value.toUpperCase();
    }

    items = parseRoster(namesInput.value);
    buildReel();
    syncPosition();

    filterPosInput.addEventListener("input", syncPosition);
    spinBtn.addEventListener("click", spin);
    updateRosterBtn.addEventListener("click", updateRoster);
    clearHistoryBtn.addEventListener("click", resetHistory);
    window.addEventListener("resize", highlightCenterCard);
  </script>
</body>
</html>
