<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JTC FIFA SPINS</title>
  <style>
    :root{
      --bg1:#fff3ea;
      --bg2:#ffd5bb;
      --panel:#fffaf5;
      --text:#6b4234;
      --muted:#9a7464;
      --peach:#ffb38a;
      --peach-dark:#f08b5d;
      --shadow:0 14px 30px rgba(140, 89, 59, .16);
      --bronze:#b67b4d;
      --silver:#b8c2cc;
      --gold:#d6a04b;
      --totw:#31456c;
      --tots:#127d86;
      --futties:#d83b84;
      --icon:#c0a05a;
      --jb:#39aee8;
      --gg:#bb962f;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      min-height:100vh;
      color:var(--text);
      background:
        radial-gradient(circle at top, rgba(255,255,255,.55), transparent 30%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      overflow-x:hidden;
    }

    .app{
      width:min(1180px, calc(100% - 20px));
      margin:0 auto;
      padding:18px 0 36px;
    }

    .hero{
      text-align:center;
      margin-bottom:18px;
    }

    .hero h1{
      margin:0;
      font-size:clamp(2.1rem, 4vw, 3.6rem);
      letter-spacing:.06em;
      color:#7a4636;
      text-shadow:0 2px 0 rgba(255,255,255,.45);
    }

    .hero p{
      margin:8px 0 0;
      color:var(--muted);
      font-weight:600;
    }

    .panel{
      background:rgba(255,248,243,.72);
      border:1px solid rgba(255,255,255,.55);
      border-radius:22px;
      box-shadow:var(--shadow);
      backdrop-filter: blur(10px);
    }

    .top-grid{
      display:grid;
      grid-template-columns: 1.2fr .8fr;
      gap:16px;
      margin-bottom:16px;
    }

    .catalog, .tracker, .pack-area, .collection{
      padding:16px;
    }

    .section-title{
      margin:0 0 14px;
      font-size:1.1rem;
      color:#7a4636;
      letter-spacing:.04em;
      text-transform:uppercase;
    }

    .catalog-grid,
    .collection-grid{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap:12px;
    }

    .mini-card{
      border-radius:18px;
      padding:12px;
      min-height:150px;
      color:white;
      position:relative;
      overflow:hidden;
      box-shadow:0 10px 20px rgba(0,0,0,.12);
      border:1px solid rgba(255,255,255,.28);
    }

    .mini-card::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(135deg, rgba(255,255,255,.28), transparent 34%, transparent 66%, rgba(255,255,255,.18));
      pointer-events:none;
    }

    .mini-card .rarity{
      display:inline-block;
      font-size:.7rem;
      font-weight:800;
      letter-spacing:.1em;
      text-transform:uppercase;
      padding:5px 8px;
      border-radius:999px;
      background:rgba(255,255,255,.18);
      margin-bottom:10px;
    }

    .mini-card .name{
      font-size:1.35rem;
      font-weight:900;
      line-height:1;
      margin-top:6px;
    }

    .mini-card .pos{
      margin-top:8px;
      font-size:.9rem;
      opacity:.9;
      font-weight:700;
    }

    .mini-card .rating{
      margin-top:14px;
      font-size:2rem;
      font-weight:900;
    }

    .bronze-card{background:linear-gradient(135deg, #b06a3f, #7d4422)}
    .silver-card{background:linear-gradient(135deg, #e0e7ef, #a6b3c0); color:#283241}
    .gold-card{background:linear-gradient(135deg, #ffd978, #d79a20); color:#4b3205}
    .totw-card{background:linear-gradient(135deg, #2d3b57, #0f1728)}
    .tots-card{background:linear-gradient(135deg, #183c8a, #0d9f9a)}
    .futties-card{background:linear-gradient(135deg, #ef4c93, #c41f67, #3bc9df)}
    .icon-card{background:linear-gradient(135deg, #fff0c5, #c9a256, #7e5d23); color:#3b2500}
    .jb-card{background:linear-gradient(135deg, #ffe76d, #38bdf8); color:#172033}
    .gg-card{background:linear-gradient(135deg, #fff2c7, #c89f43, #7a5d16); color:#2f2002}

    .tracker-grid{
      display:grid;
      grid-template-columns:repeat(2, 1fr);
      gap:12px;
    }

    .set-box{
      background:rgba(255,255,255,.6);
      border-radius:18px;
      padding:14px;
      border:1px solid rgba(122,70,54,.12);
    }

    .set-box h3{
      margin:0 0 8px;
      font-size:1rem;
      color:#7a4636;
    }

    .set-box .count{
      font-size:1.8rem;
      font-weight:900;
      color:#9b5a44;
    }

    .set-box .sub{
      margin-top:4px;
      font-size:.88rem;
      color:var(--muted);
      font-weight:600;
    }

    .pack-area{
      margin-bottom:16px;
    }

    .pack-stage{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
      align-items:center;
    }

    .pack-card-wrap{
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:360px;
      position:relative;
    }

    .pack-card{
      width:290px;
      height:410px;
      border-radius:22px;
      position:relative;
      overflow:hidden;
      background:linear-gradient(180deg, #f4b48e, #e98359);
      box-shadow:0 16px 36px rgba(140,89,59,.25), inset 0 0 0 2px rgba(255,255,255,.2);
      border:4px solid rgba(255,255,255,.3);
      transform:scale(.96);
      opacity:.75;
      transition:transform .35s ease, opacity .35s ease, filter .35s ease;
    }

    .pack-card.reveal{
      animation: revealPop 700ms ease-out forwards;
    }

    @keyframes revealPop{
      0%{ transform:scale(.78); opacity:0; filter:blur(2px) brightness(1.1); }
      35%{ transform:scale(1.02); opacity:1; }
      70%{ transform:scale(.99); }
      100%{ transform:scale(1); opacity:1; }
    }

    .pack-card::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 20% 15%, rgba(255,255,255,.35), transparent 20%),
        radial-gradient(circle at 80% 18%, rgba(255,255,255,.18), transparent 16%),
        linear-gradient(135deg, rgba(255,255,255,.18), transparent 28%, transparent 72%, rgba(255,255,255,.12));
      pointer-events:none;
      opacity:.95;
    }

    .pack-card.flash-bronze{background:linear-gradient(180deg, #b06a3f, #7d4422)}
    .pack-card.flash-silver{background:linear-gradient(180deg, #e0e7ef, #a6b3c0)}
    .pack-card.flash-gold{background:linear-gradient(180deg, #ffd978, #d79a20)}
    .pack-card.flash-totw{background:linear-gradient(180deg, #2d3b57, #0f1728)}
    .pack-card.flash-tots{background:linear-gradient(180deg, #183c8a, #0d9f9a)}
    .pack-card.flash-futties{background:linear-gradient(180deg, #ef4c93, #c41f67, #3bc9df)}
    .pack-card.flash-icon{background:linear-gradient(180deg, #fff0c5, #c9a256, #7e5d23)}
    .pack-card.flash-jb{background:linear-gradient(180deg, #ffe76d, #38bdf8)}
    .pack-card.flash-gg{background:linear-gradient(180deg, #fff2c7, #c89f43, #7a5d16)}

    .pack-card .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:14px 14px 0;
      color:white;
      position:relative;
      z-index:2;
      font-weight:900;
    }

    .rating-bubble{
      width:76px;
      height:76px;
      border-radius:50%;
      background:rgba(255,255,255,.18);
      border:2px solid rgba(255,255,255,.35);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:2.1rem;
      box-shadow:0 8px 18px rgba(0,0,0,.16);
    }

    .position-pill{
      background:rgba(255,255,255,.18);
      border:1px solid rgba(255,255,255,.3);
      border-radius:999px;
      padding:8px 12px;
      font-size:1rem;
    }

    .art{
      position:relative;
      margin:10px 14px;
      height:210px;
      border-radius:16px;
      overflow:hidden;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.2);
    }

    .art::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(135deg, rgba(255,255,255,.18), transparent 40%, rgba(255,255,255,.08));
      mix-blend-mode:overlay;
    }

    .card-name{
      margin:6px 12px 0;
      font-size:1.6rem;
      font-weight:900;
      text-align:center;
      color:white;
      text-transform:uppercase;
      letter-spacing:.05em;
      min-height:30px;
    }

    .small-meta{
      margin:8px 12px 0;
      display:flex;
      justify-content:space-between;
      color:rgba(255,255,255,.92);
      font-weight:700;
      font-size:.92rem;
    }

    .stats-grid{
      margin:16px 12px 0;
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:10px;
    }

    .stat-cell{
      background:rgba(255,255,255,.18);
      border:1px solid rgba(255,255,255,.24);
      border-radius:12px;
      padding:8px 6px;
      text-align:center;
      color:white;
    }

    .stat-cell .label{
      font-size:.68rem;
      opacity:.92;
      font-weight:800;
      letter-spacing:.06em;
    }

    .stat-cell .val{
      font-size:1.25rem;
      font-weight:900;
      margin-top:4px;
    }

    .pack-controls{
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:stretch;
    }

    .action-btn{
      border:none;
      border-radius:14px;
      padding:16px 18px;
      font-weight:900;
      font-size:1.1rem;
      cursor:pointer;
      box-shadow:var(--shadow);
      transition:transform .18s ease, opacity .18s ease;
      text-transform:uppercase;
    }
    .action-btn:hover{ transform:translateY(-1px); }
    .action-btn:disabled{ opacity:.6; cursor:not-allowed; transform:none; }

    .spin-btn{ background:linear-gradient(180deg, #ffb58f, #f28d60); color:white; }
    .open-btn{ background:linear-gradient(180deg, #ffffff, #f0d9c9); color:#7a4636; }
    .reset-btn{ background:linear-gradient(180deg, #f5c7b0, #eba07e); color:#7a4636; }

    .status{
      margin-top:8px;
      color:#9a6e5d;
      font-weight:700;
      min-height:24px;
    }

    .collection{
      margin-top:16px;
      padding:16px;
    }

    .hidden{ display:none !important; }

    @media (max-width: 920px){
      .top-grid, .pack-stage{
        grid-template-columns:1fr;
      }
      .pack-card-wrap{
        min-height:unset;
      }
      .pack-card{
        width:min(100%, 290px);
        height:400px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="hero">
      <h1>JTC FIFA SPINS</h1>
      <p>Open packs, collect cards, and complete every rarity set.</p>
    </div>

    <div class="top-grid">
      <div class="panel catalog">
        <h2 class="section-title">Card Catalogue</h2>
        <div id="catalogGrid" class="catalog-grid"></div>
      </div>

      <div class="panel tracker">
        <h2 class="section-title">Completion Tracker</h2>
        <div id="trackerGrid" class="tracker-grid"></div>
      </div>
    </div>

    <div class="panel pack-area">
      <h2 class="section-title">Pack Opening</h2>
      <div class="pack-stage">
        <div class="pack-card-wrap">
          <div id="packCard" class="pack-card">
            <div class="top">
              <div class="rating-bubble" id="packRating">--</div>
              <div class="position-pill" id="packPos">??</div>
            </div>
            <div class="art" id="packArt"></div>
            <div class="card-name hidden" id="packName">READY</div>
            <div class="small-meta">
              <span id="packRarity">Hidden</span>
              <span id="packClub">Club</span>
            </div>
            <div class="stats-grid">
              <div class="stat-cell"><div class="label">PAC</div><div class="val" id="s1">--</div></div>
              <div class="stat-cell"><div class="label">SHO</div><div class="val" id="s2">--</div></div>
              <div class="stat-cell"><div class="label">PAS</div><div class="val" id="s3">--</div></div>
              <div class="stat-cell"><div class="label">DRI</div><div class="val" id="s4">--</div></div>
              <div class="stat-cell"><div class="label">DEF</div><div class="val" id="s5">--</div></div>
              <div class="stat-cell"><div class="label">PHY</div><div class="val" id="s6">--</div></div>
            </div>
          </div>
        </div>

        <div class="pack-controls">
          <button id="openPackBtn" class="action-btn spin-btn">Open Pack</button>
          <button id="nextRevealBtn" class="action-btn open-btn" disabled>Reveal</button>
          <button id="resetBtn" class="action-btn reset-btn">Reset Collection</button>
          <div id="status" class="status">Pick a card type and open a pack.</div>
        </div>
      </div>
    </div>

    <div class="panel collection">
      <h2 class="section-title">Your Collection</h2>
      <div id="collectionGrid" class="collection-grid"></div>
    </div>
  </div>

  <script>
    const cards = [
      { name:"Ethan", rating:80, position:"RB", rarity:"Bronze", club:"Pine", stats:[82,30,62,78,55,70] },
      { name:"Reuben", rating:80, position:"LB", rarity:"Bronze", club:"Pine", stats:[81,28,60,77,57,68] },
      { name:"Seb", rating:80, position:"CB", rarity:"Bronze", club:"Pine", stats:[62,20,50,58,84,76] },
      { name:"Ari", rating:98, position:"LW", rarity:"FUTTIES", club:"JTC", stats:[99,96,94,99,38,71] },
      { name:"James", rating:83, position:"ST", rarity:"Gold", club:"JTC", stats:[84,82,63,79,28,74] },
      { name:"Ben", rating:83, position:"ST", rarity:"Gold", club:"JTC", stats:[83,81,61,78,30,73] },
      { name:"Noah", rating:96, position:"CM", rarity:"JOGA BONITO", club:"JTC", stats:[97,85,96,98,44,75] },
      { name:"Donny", rating:82, position:"CM", rarity:"Silver", club:"JTC", stats:[79,68,80,80,52,68] },
      { name:"Charlie", rating:84, position:"ST", rarity:"Gold", club:"JTC", stats:[83,84,66,79,31,73] },
      { name:"Flynn", rating:80, position:"LM", rarity:"Bronze", club:"Pine", stats:[80,31,64,77,44,66] },
      { name:"Mason", rating:98, position:"CAM", rarity:"FUTTIES", club:"JTC", stats:[95,91,99,98,46,72] },
      { name:"Louis", rating:82, position:"RW", rarity:"Silver", club:"JTC", stats:[83,70,78,81,35,66] },
      { name:"Hugo", rating:81, position:"ST", rarity:"Silver", club:"JTC", stats:[82,77,65,77,26,68] },
      { name:"Lachlan", rating:81, position:"CB", rarity:"Silver", club:"Pine", stats:[60,18,49,56,82,73] },
      { name:"Harry L", rating:93, position:"CB", rarity:"TOTW", club:"JTC", stats:[65,34,64,68,92,88] },
      { name:"Martin", rating:98, position:"CDM", rarity:"FUTTIES", club:"JTC", stats:[89,84,90,92,97,96] },
      { name:"Luke", rating:96, position:"GK", rarity:"ICON GK", club:"JTC", stats:[18,12,28,24,96,88] },
      { name:"Jack", rating:85, position:"GK", rarity:"Gold", club:"JTC", stats:[24,14,35,27,85,78] },
      { name:"Archie", rating:82, position:"LB", rarity:"Silver", club:"Pine", stats:[81,29,67,79,53,69] },
      { name:"CJ", rating:82, position:"RB", rarity:"Silver", club:"Pine", stats:[83,32,66,80,54,70] },
      { name:"Harry R", rating:87, position:"CAM", rarity:"Gold", club:"JTC", stats:[84,78,88,87,42,72] },
      { name:"George", rating:80, position:"ST", rarity:"Bronze", club:"Pine", stats:[79,74,61,72,22,65] },
      { name:"Aidan", rating:85, position:"RM", rarity:"Gold", club:"JTC", stats:[86,78,82,83,40,70] },
      { name:"Fred", rating:81, position:"CAM", rarity:"Silver", club:"JTC", stats:[79,66,75,78,33,66] },
      { name:"Felix", rating:83, position:"CDM", rarity:"Gold", club:"JTC", stats:[72,58,78,76,80,77] },
      { name:"Gus", rating:80, position:"LB", rarity:"Bronze", club:"Pine", stats:[80,25,63,75,44,66] },
      { name:"Jack", rating:98, position:"GK", rarity:"GG", club:"JTC", stats:[25,18,30,24,98,86] },
      { name:"Gio", rating:84, position:"CB", rarity:"Gold", club:"JTC", stats:[64,24,59,61,83,77] }
    ];

    const rarityOrder = ["Bronze","Silver","Gold","TOTW","JOGA BONITO","ICON GK","FUTTIES","GG"];

    const catalogGrid = document.getElementById("catalogGrid");
    const trackerGrid = document.getElementById("trackerGrid");
    const collectionGrid = document.getElementById("collectionGrid");
    const statusEl = document.getElementById("status");

    const packCard = document.getElementById("packCard");
    const packRating = document.getElementById("packRating");
    const packPos = document.getElementById("packPos");
    const packName = document.getElementById("packName");
    const packRarity = document.getElementById("packRarity");
    const packClub = document.getElementById("packClub");
    const statEls = [
      document.getElementById("s1"),
      document.getElementById("s2"),
      document.getElementById("s3"),
      document.getElementById("s4"),
      document.getElementById("s5"),
      document.getElementById("s6"),
    ];

    const openPackBtn = document.getElementById("openPackBtn");
    const nextRevealBtn = document.getElementById("nextRevealBtn");
    const resetBtn = document.getElementById("resetBtn");
    const flash = document.getElementById("flash");

    let collection = new Set();
    let pendingCard = null;
    let revealTimer = null;

    function getRarityClass(rarity) {
      return {
        Bronze:"bronze-card",
        Silver:"silver-card",
        Gold:"gold-card",
        TOTW:"totw-card",
        "JOGA BONITO":"jb-card",
        "ICON GK":"icon-card",
        FUTTIES:"futties-card",
        GG:"gg-card"
      }[rarity] || "gold-card";
    }

    function getFlashClass(rarity) {
      return {
        Bronze:"flash-bronze",
        Silver:"flash-silver",
        Gold:"flash-gold",
        TOTW:"flash-totw",
        "JOGA BONITO":"flash-jb",
        "ICON GK":"flash-icon",
        FUTTIES:"flash-futties",
        GG:"flash-gg"
      }[rarity] || "flash-gold";
    }

    function renderCatalog() {
      catalogGrid.innerHTML = "";
      cards.forEach(card => {
        const el = document.createElement("div");
        el.className = `mini-card ${getRarityClass(card.rarity)}`;
        el.innerHTML = `
          <div class="rarity">${card.rarity}</div>
          <div class="name">${card.name}</div>
          <div class="pos">${card.position}</div>
          <div class="rating">${card.rating}</div>
        `;
        catalogGrid.appendChild(el);
      });
    }

    function renderTracker() {
      const groups = {};
      rarityOrder.forEach(r => groups[r] = cards.filter(c => c.rarity === r));

      trackerGrid.innerHTML = "";
      rarityOrder.forEach(rarity => {
        const total = groups[rarity].length;
        const have = groups[rarity].filter(c => collection.has(`${c.name}|${c.position}|${c.rating}|${c.rarity}`)).length;
        const done = total > 0 && have === total;

        const box = document.createElement("div");
        box.className = "set-box";
        box.innerHTML = `
          <h3>${rarity}</h3>
          <div class="count">${have}/${total}</div>
          <div class="sub">${done ? "Completed" : "Still missing cards"}</div>
        `;
        trackerGrid.appendChild(box);
      });
    }

    function renderCollection() {
      collectionGrid.innerHTML = "";
      const byRarity = {};
      rarityOrder.forEach(r => byRarity[r] = cards.filter(c => c.rarity === r));

      rarityOrder.forEach(rarity => {
        const items = byRarity[rarity];
        if (!items.length) return;

        const total = items.length;
        const have = items.filter(c => collection.has(`${c.name}|${c.position}|${c.rating}|${c.rarity}`)).length;
        const done = have === total;

        const el = document.createElement("div");
        el.className = "collection-item";
        el.innerHTML = `
          <div class="head">
            <div class="title">${rarity}</div>
            <div class="completion ${done ? "done" : "missing"}">${have}/${total}</div>
          </div>
          <ul>
            ${items.map(c => `<li>${collection.has(`${c.name}|${c.position}|${c.rating}|${c.rarity}`) ? "✓" : "✕"} ${c.name} (${c.rating})</li>`).join("")}
          </ul>
        `;
        collectionGrid.appendChild(el);
      });
    }

    function setHiddenPack() {
      packCard.className = "pack-card flash-gold";
      packRating.textContent = "--";
      packPos.textContent = "??";
      packName.textContent = "READY";
      packName.classList.add("hidden");
      packRarity.textContent = "Hidden";
      packClub.textContent = "Club";
      statEls.forEach(el => el.textContent = "--");
    }

    function flashScreen(rarity) {
      flash.className = `flash-overlay ${getFlashClass(rarity)} on`;
      setTimeout(() => flash.classList.remove("on"), 220);
    }

    function showConfetti() {
      const colors = ["#ff9f68","#ffd166","#ef4c93","#7bdff2","#ffffff"];
      for (let i = 0; i < 60; i++) {
        const piece = document.createElement("div");
        piece.style.position = "fixed";
        piece.style.left = (Math.random() * 100) + "vw";
        piece.style.top = "-20px";
        piece.style.width = (6 + Math.random() * 8) + "px";
        piece.style.height = (10 + Math.random() * 14) + "px";
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.borderRadius = "2px";
        piece.style.zIndex = 9999;
        piece.style.pointerEvents = "none";
        piece.style.animation = `confettiFall ${(1000 + Math.random() * 900)}ms linear forwards`;
        piece.style.transform = `rotate(${Math.random() * 360}deg)`;
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 2200);
      }
    }

    function choosePackCard() {
      return cards[Math.floor(Math.random() * cards.length)];
    }

    function openPack() {
      if (revealTimer) return;
      pendingCard = choosePackCard();
      openPackBtn.disabled = true;
      nextRevealBtn.disabled = false;
      statusEl.textContent = "Pack opening...";
      setHiddenPack();

      flashScreen(pendingCard.rarity);
      packCard.className = `pack-card ${getFlashClass(pendingCard.rarity)}`;

      revealTimer = setTimeout(() => {
        statusEl.textContent = "Press Reveal to open the card.";
        revealTimer = null;
      }, 900);
    }

    function revealCard() {
      if (!pendingCard) return;

      const c = pendingCard;
      const rarity = c.rarity;

      packCard.className = `pack-card ${getFlashClass(rarity)} reveal`;
      packRating.textContent = c.rating;
      packPos.textContent = c.position;
      packName.textContent = c.name.toUpperCase();
      packName.classList.remove("hidden");
      packRarity.textContent = rarity;
      packClub.textContent = c.club;
      statEls.forEach((el, i) => el.textContent = c.stats[i]);

      flashScreen(rarity);
      showConfetti();

      const key = `${c.name}|${c.position}|${c.rating}|${c.rarity}`;
      collection.add(key);

      renderTracker();
      renderCollection();

      statusEl.textContent = `Collected: ${c.name} (${c.rarity}).`;
      pendingCard = null;
      openPackBtn.disabled = false;
      nextRevealBtn.disabled = true;
    }

    function resetCollection() {
      collection = new Set();
      renderTracker();
      renderCollection();
      setHiddenPack();
      statusEl.textContent = "Collection reset.";
    }

    openPackBtn.addEventListener("click", openPack);
    nextRevealBtn.addEventListener("click", revealCard);
    resetBtn.addEventListener("click", resetCollection);

    renderCatalog();
    renderTracker();
    renderCollection();
    setHiddenPack();
  </script>
</body>
</html>
