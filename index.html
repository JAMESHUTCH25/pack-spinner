<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FIFA Pack Spins – Pro Editor</title>
  <style>
    :root {
      --bg: #05070b;
      --panel: rgba(18, 24, 36, 0.85);
      --panel-strong: rgba(18, 24, 36, 0.95);
      --border: rgba(255, 255, 255, 0.08);
      --text: #eaf2ff;
      --muted: #9fb3c8;
      --accent: #00e5ff;
      --accent-2: #7b61ff;
      --accent-gradient: linear-gradient(135deg, #00e5ff, #7b61ff);
      --glow: 0 0 30px rgba(0, 229, 255, 0.15);

      --rare-common: #a0a0a0;
      --rare-rare: #4da6ff;
      --rare-epic: #b366ff;
      --rare-legendary: #ffcc00;
      --rare-icon: #ff66cc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      background:
        radial-gradient(1200px 600px at 50% -10%, #0f1a2a 0%, #05070b 60%),
        radial-gradient(800px 400px at 10% 10%, rgba(123, 97, 255, 0.08), transparent 60%),
        radial-gradient(800px 400px at 90% 20%, rgba(0, 229, 255, 0.08), transparent 60%);
      color: var(--text);
      min-height: 100vh;
    }

    .app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 22px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      margin-bottom: 24px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brand-title {
      font-weight: 800;
      font-size: 1.35rem;
      letter-spacing: 0.3px;
    }

    .brand-sub {
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .balance {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.05rem;
    }

    .balance span {
      color: var(--accent);
      text-shadow: 0 0 12px rgba(0, 229, 255, 0.35);
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.06);
      transform: translateY(-1px);
    }

    /* Store */
    .store {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .pack-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      cursor: pointer;
      user-select: none;
      position: relative;
      overflow: hidden;
    }

    .pack-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(400px 150px at 50% -20%, rgba(0, 229, 255, 0.12), transparent 60%);
      pointer-events: none;
    }

    .pack-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--glow);
      border-color: rgba(0, 229, 255, 0.35);
    }

    .pack-title {
      font-weight: 800;
      font-size: 1.1rem;
      margin: 10px 0 6px;
      letter-spacing: 0.3px;
    }

    .pack-price {
      color: var(--accent);
      font-weight: 800;
      margin-bottom: 8px;
      font-size: 0.95rem;
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.35);
    }

    .pack-desc {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .pack-art {
      width: 100%;
      height: 140px;
      background:
        linear-gradient(135deg, rgba(0, 229, 255, 0.08), rgba(123, 97, 255, 0.08)),
        linear-gradient(180deg, #0f1622, #0a0f18);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.6rem;
      color: #cfe3ff;
      letter-spacing: 1px;
      position: relative;
      overflow: hidden;
    }

    .pack-art::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(220px 100px at 50% -10%, rgba(255, 255, 255, 0.08), transparent 60%);
      pointer-events: none;
    }

    /* Open area */
    .open-area {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      text-align: center;
      margin-bottom: 28px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
    }

    .open-title {
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 14px;
      letter-spacing: 0.3px;
    }

    .pack-preview {
      width: 200px;
      height: 240px;
      margin: 0 auto 18px;
      background:
        linear-gradient(135deg, rgba(0, 229, 255, 0.1), rgba(123, 97, 255, 0.1)),
        linear-gradient(180deg, #0f1622, #0a0f18);
      border: 2px solid rgba(0, 229, 255, 0.25);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.8rem;
      color: #cfe3ff;
      letter-spacing: 1.2px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45), inset 0 0 40px rgba(0, 229, 255, 0.06);
    }

    .pack-preview::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(260px 120px at 50% -20%, rgba(0, 229, 255, 0.18), transparent 60%);
      pointer-events: none;
    }

    .pack-preview.spin {
      animation: spinPack 0.6s ease-in-out;
    }

    @keyframes spinPack {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.06); }
      100% { transform: rotate(360deg) scale(1); }
    }

    .open-btn {
      background: var(--accent-gradient);
      color: #041018;
      border: none;
      padding: 11px 26px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.1s ease, box-shadow 0.15s ease;
      box-shadow: 0 8px 25px rgba(0, 229, 255, 0.25);
    }

    .open-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
      box-shadow: 0 12px 35px rgba(0, 229, 255, 0.35);
    }

    .open-btn:disabled {
      filter: grayscale(0.7) brightness(0.7);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .card {
      background: var(--panel-strong);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(220px 100px at 50% -10%, rgba(255, 255, 255, 0.06), transparent 60%);
      pointer-events: none;
    }

    .card-name {
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 0.3px;
    }

    .card-rating {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .card-rarity {
      margin-top: 8px;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 8px;
      display: inline-block;
      align-self: center;
      border: 1px solid;
    }

    .rarity-common {
      background: rgba(160, 160, 160, 0.12);
      color: var(--rare-common);
      border-color: rgba(160, 160, 160, 0.35);
    }

    .rarity-rare {
      background: rgba(77, 166, 255, 0.12);
      color: var(--rare-rare);
      border-color: rgba(77, 166, 255, 0.35);
    }

    .rarity-epic {
      background: rgba(179, 102, 255, 0.12);
      color: var(--rare-epic);
      border-color: rgba(179, 102, 255, 0.35);
    }

    .rarity-legendary {
      background: rgba(255, 204, 0, 0.12);
      color: var(--rare-legendary);
      border-color: rgba(255, 204, 0, 0.35);
    }

    .rarity-icon {
      background: rgba(255, 102, 204, 0.12);
      color: var(--rare-icon);
      border-color: rgba(255, 102, 204, 0.35);
    }

    /* Inventory */
    .inventory {
      margin-top: 32px;
    }

    .section-title {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: 0.3px;
    }

    .inventory-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }

    .empty {
      color: var(--muted);
      font-size: 0.9rem;
    }

    /* Responsive tweaks */
    @media (max-width: 600px) {
      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
      .balance {
        width: 100%;
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="brand-title">FIFA Pack Spins</div>
        <div class="brand-sub">Pro Editor Simulator</div>
      </div>
      <div class="balance">
        <div>Coins: <span id="coinBalance">5000</span></div>
        <button class="btn-ghost" id="addCoinsBtn">+ Add 5000</button>
      </div>
    </header>

    <section class="store" id="storeSection">
      <!-- Packs injected by JS -->
    </section>

    <section class="open-area">
      <div class="open-title" id="openTitle">Select a pack to open</div>
      <div class="pack-preview" id="packPreview">Pack</div>
      <button class="open-btn" id="openBtn" disabled>Open Pack</button>
      <div class="results" id="resultsArea"></div>
    </section>

    <section class="inventory">
      <div class="section-title">Your Players</div>
      <div class="inventory-list" id="inventoryList">
        <div class="empty">No players yet. Open some packs!</div>
      </div>
    </section>
  </div>

  <script>
    // ----- Configuration -----
    const RARITIES = [
      { name: 'Common',    weight: 60, class: 'rarity-common' },
      { name: 'Rare',      weight: 25, class: 'rarity-rare' },
      { name: 'Epic',      weight: 10, class: 'rarity-epic' },
      { name: 'Legendary', weight: 4,  class: 'rarity-legendary' },
      { name: 'Icon',      weight: 1,  class: 'rarity-icon' }
    ];

    const NAMES = [
      "Smith","Johnson","Williams","Brown","Jones","Garcia","Miller","Davis","Rodriguez","Martinez",
      "Hernandez","Lopez","Gonzalez","Wilson","Anderson","Thomas","Taylor","Moore","Jackson","Martin",
      "Lee","Perez","Thompson","White","Harris","Sanchez","Clark","Ramirez","Lewis","Robinson",
      "Walker","Young","Allen","King","Wright","Scott","Torres","Nguyen","Hill","Flores"
    ];

    const FIRST_NAMES = [
      "James","John","Robert","Michael","William","David","Richard","Joseph","Thomas","Charles",
      "Christopher","Daniel","Matthew","Anthony","Mark","Donald","Steven","Andrew","Paul","Joshua",
      "Kenneth","Kevin","Brian","George","Timothy","Ronald","Edward","Jason","Jeffrey","Ryan",
      "Jacob","Gary","Nicholas","Eric","Jonathan","Stephen","Larry","Justin","Scott","Brandon"
    ];

    const POSITIONS = ["GK","CB","RB","LB","CDM","CM","CAM","LW","RW","ST","CF"];

    const PACKS = [
      {
        id: 'bronze',
        title: 'Bronze Pack',
        price: 400,
        desc: '5 players • Mostly Common',
        cards: 5,
        bias: { Common: 80, Rare: 15, Epic: 4, Legendary: 1, Icon: 0 }
      },
      {
        id: 'silver',
        title: 'Silver Pack',
        price: 2500,
        desc: '5 players • Better odds',
        cards: 5,
        bias: { Common: 50, Rare: 35, Epic: 10, Legendary: 4, Icon: 1 }
      },
      {
        id: 'gold',
        title: 'Gold Pack',
        price: 7500,
        desc: '5 players • High chance of Rare+',
        cards: 5,
        bias: { Common: 25, Rare: 45, Epic: 20, Legendary: 8, Icon: 2 }
      }
    ];

    // ----- State -----
    let coins = 5000;
    let selectedPack = null;
    let inventory = [];

    // ----- Helpers -----
    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function pickRarity(bias) {
      const total = Object.values(bias).reduce((a,b)=>a+b,0);
      let r = randInt(1, total);
      for (const [name, w] of Object.entries(bias)) {
        if (r <= w) return name;
        r -= w;
      }
      return 'Common';
    }

    function generatePlayer(bias) {
      const rarityName = pickRarity(bias);
      const ratingBase = {
        Common: 65,
        Rare: 75,
        Epic: 82,
        Legendary: 88,
        Icon: 92
      }[rarityName];

      const rating = randInt(ratingBase, ratingBase + randInt(0, 6));
      const position = POSITIONS[randInt(0, POSITIONS.length - 1)];
      const name = FIRST_NAMES[randInt(0, FIRST_NAMES.length - 1)] + " " + NAMES[randInt(0, NAMES.length - 1)];

      const rarityDef = RARITIES.find(r => r.name === rarityName);

      return {
        id: Date.now() + "_" + Math.random().toString(16).slice(2),
        name,
        rating,
        position,
        rarity: rarityName,
        rarityClass: rarityDef.class
      };
    }

    function renderStore() {
      const store = document.getElementById('storeSection');
      store.innerHTML = '';
      PACKS.forEach(pack => {
        const el = document.createElement('div');
        el.className = 'pack-card';
        el.innerHTML = `
          <div class="pack-art">${pack.title.split(' ')[0]}</div>
          <div class="pack-title">${pack.title}</div>
          <div class="pack-price">${pack.price} coins</div>
          <div class="pack-desc">${pack.desc}</div>
        `;
        el.addEventListener('click', () => selectPack(pack));
        store.appendChild(el);
      });
    }

    function updateBalance() {
      document.getElementById('coinBalance').textContent = coins;
    }

    function selectPack(pack) {
      selectedPack = pack;
      document.getElementById('openTitle').textContent = `Opening: ${pack.title}`;
      document.getElementById('packPreview').textContent = pack.title.split(' ')[0];
      const btn = document.getElementById('openBtn');
      btn.disabled = coins < pack.price;
    }

    function renderResults(players) {
      const area = document.getElementById('resultsArea');
      area.innerHTML = '';
      players.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div>
            <div class="card-name">${p.name}</div>
            <div class="card-rating">${p.rating} • ${p.position}</div>
          </div>
          <div class="card-rarity ${p.rarityClass}">${p.rarity}</div>
        `;
        area.appendChild(card);
      });
    }

    function renderInventory() {
      const list = document.getElementById('inventoryList');
      list.innerHTML = '';
      if (inventory.length === 0) {
        list.innerHTML = '<div class="empty">No players yet. Open some packs!</div>';
        return;
      }
      const shown = inventory.slice(-20);
      shown.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div>
            <div class="card-name">${p.name}</div>
            <div class="card-rating">${p.rating} • ${p.position}</div>
          </div>
          <div class="card-rarity ${p.rarityClass}">${p.rarity}</div>
        `;
        list.appendChild(card);
      });
    }

    function openPack() {
      if (!selectedPack || coins < selectedPack.price) return;
      coins -= selectedPack.price;
      updateBalance();

      const preview = document.getElementById('packPreview');
      const btn = document.getElementById('openBtn');
      btn.disabled = true;

      preview.classList.remove('spin');
      void preview.offsetWidth;
      preview.classList.add('spin');

      const players = [];
      for (let i = 0; i < selectedPack.cards; i++) {
        players.push(generatePlayer(selectedPack.bias));
      }

      setTimeout(() => {
        renderResults(players);
        inventory.push(...players);
        renderInventory();
        btn.disabled = coins < selectedPack.price;
      }, 650);
    }

    // ----- Events -----
    document.getElementById('openBtn').addEventListener('click', openPack);
    document.getElementById('addCoinsBtn').addEventListener('click', () => {
      coins += 5000;
      updateBalance();
      if (selectedPack) {
        const btn = document.getElementById('openBtn');
        btn.disabled = coins < selectedPack.price;
      }
    });

    // ----- Init -----
    renderStore();
    updateBalance();
    renderInventory();
  </script>
</body>
</html>
