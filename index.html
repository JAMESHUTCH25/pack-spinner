<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic Pack Draft Spinner</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #252830; 
      color: white;
      text-align: center;
      margin: 0;
      padding: 24px 16px;
    }
    
    .interface-container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* Top filter bar container */
    .filter-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: #facc15; 
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      margin-bottom: 24px;
      border: 1px solid #d97706;
    }
    .filter-item-input {
      background: transparent;
      border: none;
      padding: 16px;
      font-size: 1.8rem;
      font-weight: 900;
      color: #000000;
      text-align: center;
      width: 100%;
      box-sizing: border-box;
      text-transform: uppercase;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    .filter-item-input:focus {
      outline: 2px dashed #000000;
      background: rgba(255, 255, 255, 0.2);
    }
    .filter-item-wrapper {
      border-right: 2px solid rgba(0,0,0,0.15);
    }
    .filter-item-wrapper:last-child {
      border-right: none;
    }

    /* Board split layout */
    .game-layout {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-around;
      align-items: center;
      gap: 30px;
      margin-top: 10px;
    }

    /* Player Card baseline structural container mapping rules */
    .player-card-container {
      width: 240px;
      height: 330px;
      position: relative;
    }
    .player-card {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #e2e8f0, #cbd5e1); 
      border-top-left-radius: 40px;
      border-top-right-radius: 40px;
      border-bottom-left-radius: 8px;
      border-bottom-right-radius: 8px;
      border: 3px solid #94a3b8;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      position: relative;
      overflow: hidden;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      box-sizing: border-box;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    /* --- THE OFFICIAL RARITY SKIN ENGINE --- */
    .skin-bronze {
      background: linear-gradient(135deg, #a75a28, #5c2c0e) !important;
      border-color: #3d1b07 !important;
      color: #ffedd5 !important;
    }
    .skin-bronze .card-name { background: rgba(0,0,0,0.25) !important; color: white !important; }

    .skin-silver {
      background: linear-gradient(135deg, #e2e8f0, #cbd5e1) !important; 
      border-color: #94a3b8 !important;
      color: #1e293b !important;
    }
    .skin-silver .card-name { background: rgba(255,255,255,0.4) !important; color: #1e293b !important; }

    .skin-gold {
      background: linear-gradient(135deg, #fef08a, #ca8a04) !important;
      border-color: #facc15 !important; 
      color: #451a03 !important;
      box-shadow: 0 10px 30px rgba(234, 179, 8, 0.4);
    }
    .skin-gold .card-name { background: rgba(255,255,255,0.5) !important; color: #451a03 !important; }

    .skin-tots {
      background: linear-gradient(135deg, #1e1b4b, #2563eb, #0d9488) !important;
      border-color: #facc15 !important;
      color: #ffffff !important;
      box-shadow: 0 10px 30px rgba(37, 99, 235, 0.6);
    }
    .skin-tots .card-name { background: rgba(0, 0, 0, 0.4) !important; color: #facc15 !important; }

    .skin-futties {
      background: linear-gradient(135deg, #ec4899, #be185d, #06b6d4) !important;
      border-color: #f43f5e !important;
      color: #ffffff !important;
      box-shadow: 0 0 35px rgba(236, 72, 153, 0.7);
    }
    .skin-futties .card-name { background: rgba(255, 255, 255, 0.2) !important; color: #ffffff !important; }

    .player-card.skin-futties {
      animation: pulsateGlow 1.5s infinite alternate;
    }

    @keyframes pulsateGlow {
      0% { box-shadow: 0 0 15px rgba(236, 72, 153, 0.5); }
      100% { box-shadow: 0 0 35px rgba(6, 182, 212, 0.9); }
    }

    /* Textured wave overlay internal graphic vectors */
    .player-card::before {
      content: "";
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      background: 
        radial-gradient(circle at 120% 30%, transparent 50%, rgba(255,255,255,0.18) 52%, transparent 55%),
        radial-gradient(circle at 130% 40%, transparent 50%, rgba(255,255,255,0.18) 52%, transparent 55%),
        radial-gradient(circle at 140% 50%, transparent 50%, rgba(255,255,255,0.18) 52%, transparent 55%);
      pointer-events: none;
    }
    
    .card-pos { font-size: 1.4rem; font-weight: 800; text-align: left; align-self: flex-start; }
    .card-rating font-size: 3.5rem; font-weight: 900; line-height: 1; text-align: center; margin-top: 15px; }
    .card-name { font-size: 1.5rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; text-align: center; margin-bottom: 10px; padding: 4px 8px; border-radius: 4px; }

    /* --- Horizontal Spinner Tracker Box CSS UI --- */
    .spinner-view-window {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 90px;
      background: #1a1c23;
      border: 3px solid #facc15;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 8px 20px rgba(0,0,0,0.4);
    }
    .spinner-view-window::before, .spinner-view-window::after {
      content: ""; position: absolute; left: 50%; transform: translateX(-50%); width: 0; height: 0; z-index: 10;
    }
    .spinner-view-window::before { top: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 15px solid #ef4444; }
    .spinner-view-window::after { bottom: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-bottom: 15px solid #ef4444; }
    
    .center-indicator-line {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 130px; height: 100%;
      border-left: 2px dashed rgba(239, 68, 68, 0.4); border-right: 2px dashed rgba(239, 68, 68, 0.4);
      background: rgba(255, 255, 255, 0.03); pointer-events: none; z-index: 5;
    }
    canvas { display: block; }

    /* Action Control Box layout */
    .control-panel { display: flex; flex-direction: column; align-items: center; gap: 15px; }
    .action-button {
      background: #ca8a04; color: #cbd5e1; font-size: 1.1rem; font-weight: bold; border: none; padding: 20px 50px;
      border-radius: 8px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); text-transform: uppercase; letter-spacing: 1px; transition: all 0.2s;
    }
    .action-button.ready { background: #facc15; color: #111827; box-shadow: 0 0 15px rgba(250, 204, 21, 0.4); }
    .action-button:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
    .action-button:disabled { background: #4a4d56; color: #71717a; cursor: not-allowed; transform: none; }

    /* --- DRAFT HISTORY BOARD STYLING --- */
    .history-board-container {
      margin-top: 30px;
      background: #1a1c23;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .history-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 10px;
      margin-bottom: 15px;
    }
    .history-title { font-size: 1.4rem; font-weight: 800; color: #facc15; text-transform: uppercase; letter-spacing: 0.5px; margin: 0; }
    .clear-history-btn {
      background: #ef4444; color: white; border: none; padding: 6px 14px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: opacity 0.2s;
    }
    .clear-history-btn:hover { opacity: 0.9; }
    .history-grid-ledger {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      min-height: 80px;
    }
    .history-mini-card {
      width: 100px;
      padding: 10px 6px;
      border-radius: 8px;
      border: 2px solid #cbd5e1;
      background: #cbd5e1;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-weight: bold;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      font-size: 0.8rem;
    }
    .mini-card-rating { font-size: 1.4rem; font-weight: 900; line-height: 1; margin: 2px 0; }
    .mini-card-name { text-transform: uppercase; font-size: 0.7rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; text-align: center; }
    .mini-card-pos { font-size: 0.65rem; opacity: 0.8; }

    /* Configurations panel */
    .config-box {
      margin-top: 35px; background: rgba(0, 0, 0, 0.2); padding: 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);
    }
    .config-input { width: min(100%, 600px); padding: 10px; border-radius: 6px; border: none; background: #1e293b; color: white; margin-bottom: 10px; }
    .result-banner { font-size: 1.6rem; font-weight: bold; color: #facc15; margin-top: 15px; }
    .hint-text { font-size: 0.85rem; opacity: 0.6; margin-top: -15px; margin-bottom: 15px; }
  </style>
</head>
<body>

  <div class="interface-container">
    <!-- Filter Tags -->
    <div class="filter-bar">
      <div class="filter-item-wrapper"><input type="text" class="filter-item-input" id="filter-pos" value="ST" oninput="syncCardPosition()"></div>
      <div class="filter-item-wrapper"><input type="text" class="filter-item-input" id="filter-quality" value="Dynamic" disabled style="opacity:0.6; cursor:not-allowed;"></div>
      <div class="filter-item-wrapper"><input type="text" class="filter-item-input" id="filter-rating" value="Auto-Skin"></div>
    </div>
