<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JTC FIFA SPINS</title>
  <style>
    :root{
      --bg1:#fff3ea;
      --bg2:#ffd9c0;
      --panel:#fffaf5;
      --text:#6b4234;
      --muted:#9a7464;
      --peach:#ffb38a;
      --peach-dark:#f08b5d;
      --shadow:0 14px 30px rgba(140, 89, 59, .16);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial, sans-serif;
      min-height:100vh;
      color:var(--text);
      background:linear-gradient(180deg,var(--bg1),var(--bg2));
    }
    .app{
      width:min(1120px, calc(100% - 20px));
      margin:0 auto;
      padding:18px 0 36px;
    }
    h1,h2,h3,p{margin:0}
    .hero{text-align:center;margin-bottom:16px}
    .hero h1{font-size:clamp(2rem,4vw,3.4rem);letter-spacing:.06em}
    .hero p{margin-top:8px;color:var(--muted);font-weight:700}

    .panel{
      background:rgba(255,248,243,.9);
      border:1px solid rgba(255,255,255,.65);
      border-radius:20px;
      box-shadow:var(--shadow);
      padding:14px;
      margin-bottom:14px;
    }

    .section-title{
      font-size:1rem;
      text-transform:uppercase;
      letter-spacing:.05em;
      margin-bottom:12px;
      color:#7a4636;
    }

    .top-grid{
      display:grid;
      grid-template-columns:1.2fr .8fr;
      gap:14px;
    }

    .grid{
      display:grid;
      gap:10px;
      grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    }

    .mini-card, .set-box, .collection-item{
      border-radius:16px;
      padding:12px;
      background:#fff;
      border:1px solid rgba(122,70,54,.12);
    }

    .mini-card{
      color:#fff;
      min-height:142px;
      box-shadow:0 8px 18px rgba(0,0,0,.08);
    }
    .mini-card .rarity{
      display:inline-block;
      font-size:.68rem;
      font-weight:800;
      letter-spacing:.1em;
      text-transform:uppercase;
      padding:5px 8px;
      border-radius:999px;
      background:rgba(255,255,255,.18);
      margin-bottom:10px;
    }
    .mini-card .name{font-size:1.25rem;font-weight:900;line-height:1.05}
    .mini-card .pos{margin-top:8px;font-size:.9rem;font-weight:700}
    .mini-card .rating{margin-top:14px;font-size:2rem;font-weight:900}

    .bronze-card{background:linear-gradient(135deg,#b06a3f,#7d4422)}
    .silver-card{background:linear-gradient(135deg,#e0e7ef,#a6b3c0);color:#283241}
    .gold-card{background:linear-gradient(135deg,#ffd978,#d79a20);color:#4b3205}
    .totw-card{background:linear-gradient(135deg,#2d3b57,#0f1728)}
    .jb-card{background:linear-gradient(135deg,#ffe76d,#38bdf8);color:#172033}
    .icon-card{background:linear-gradient(135deg,#fff0c5,#c9a256,#7e5d23)}
    .futties-card{background:linear-gradient(135deg,#ef4c93,#c41f67,#3bc9df)}
    .gg-card{background:linear-gradient(135deg,#fff2c7,#c89f43,#7a5d16);color:#2f2002}

    .tracker-grid{
      display:grid;
      gap:10px;
      grid-template-columns:repeat(2,1fr);
    }
    .set-box h3{font-size:.98rem;color:#7a4636;margin-bottom:6px}
    .set-box .count{font-size:1.7rem;font-weight:900;color:#9b5a44}
    .set-box .sub{margin-top:4px;font-size:.87rem;color:var(--muted);font-weight:700}

    .pack-stage{
      display:grid;
      grid-template-columns:1fr .8fr;
      gap:14px;
      align-items:center;
    }
    .pack-wrap{
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:360px;
    }
    .pack-card{
      width:290px;
      height:410px;
      border-radius:22px;
      position:relative;
      overflow:hidden;
      background:linear-gradient(180deg,#f4b48e,#e98359);
      box-shadow:0 16px 36px rgba(140,89,59,.25), inset 0 0 0 2px rgba(255,255,255,.2);
      border:4px solid rgba(255,255,255,.3);
      transform:scale(.98);
      opacity:.8;
      transition:transform .3s ease, opacity .3s ease;
    }
    .pack-card.reveal{animation:revealPop .6s ease-out forwards}
    @keyframes revealPop{
      0%{transform:scale(.82);opacity:0}
      45%{transform:scale(1.03);opacity:1}
      100%{transform:scale(1);opacity:1}
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:14px 14px 0;
      color:#fff;
      font-weight:900;
      position:relative;
      z-index:2;
    }
    .rating-bubble{
      width:74px;height:74px;border-radius:50%;
      background:rgba(255,255,255,.18);
      border:2px solid rgba(255,255,255,.35);
      display:flex;align-items:center;justify-content:center;
      font-size:2rem;
    }
    .position-pill{
      background:rgba(255,255,255,.18);
      border:1px solid rgba(255,255,255,.3);
      border-radius:999px;
      padding:8px 12px;
      font-size:1rem;
    }
    .art{
      margin:10px 14px;
      height:210px;
      border-radius:16px;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.2);
    }
    .card-name{
      margin:6px 12px 0;
      font-size:1.55rem;
      font-weight:900;
      text-align:center;
      color:#fff;
      text-transform:uppercase;
      letter-spacing:.05em;
      min-height:30px;
    }
    .small-meta{
      margin:8px 12px 0;
      display:flex;
      justify-content:space-between;
      color:rgba(255,255,255,.92);
      font-weight:700;
      font-size:.92rem;
    }
    .stats-grid{
      margin:16px 12px 0;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
    }
    .stat-cell{
      background:rgba(255,255,255,.18);
      border:1px solid rgba(255,255,255,.24);
      border-radius:12px;
      padding:8px 6px;
      text-align:center;
      color:#fff;
    }
    .label{font-size:.68rem;font-weight:800;letter-spacing:.06em}
    .val{font-size:1.18rem;font-weight:900;margin-top:4px}

    .controls{display:flex;flex-direction:column;gap:10px}
    button{
      border:none;border-radius:14px;padding:15px 16px;
      font-weight:900;font-size:1.05rem;cursor:pointer;
      box-shadow:var(--shadow);
      text-transform:uppercase;
    }
    .spin{background:linear-gradient(180deg,#ffb58f,#f28d60);color:#fff}
    .reveal-btn{background:linear-gradient(180deg,#fff,#f0d9c9);color:#7a4636}
    .reset{background:linear-gradient(180deg,#f5c7b0,#eba07e);color:#7a4636}
    button:disabled{opacity:.6;cursor:not-allowed;box-shadow:none}
    .status{min-height:22px;color:#9a6e5d;font-weight:700;margin-top:4px}

    .hidden{display:none !important}

    .collection-grid{
      display:grid;
      gap:10px;
      grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    }
    .collection-item .head{
      display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;
    }
    .collection-item .title{font-weight:900;color:#7a4636}
    .collection-item .completion{font-weight:900}
    .collection-item .done{color:#2a8f4a}
    .collection-item .missing{color:#b05a44}
    .collection-item ul{list-style:none;padding:0;margin:0;display:grid;gap:6px;font-size:.92rem}
    .collection-item li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    @media (max-width:900px){
      .top-grid,.pack-stage{grid-template-columns:1fr}
      .pack-wrap{min-height:unset}
      .pack-card{width:min(100%,290px);height:400px}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="hero">
      <h1>JTC FIFA SPINS</h1>
      <p>Open packs, collect cards, and complete every rarity set.</p>
    </div>

    <div class="top-grid">
      <div class="panel">
        <div class="section-title">Card Catalogue</div>
        <div id="catalogGrid" class="grid"></div>
      </div>

      <div class="panel">
        <div class="section-title">Completion Tracker</div>
        <div id="trackerGrid" class="tracker-grid"></div>
      </div>
    </div>

    <div class="panel">
      <div class="section-title">Pack Opening</div>
      <div class="pack-stage">
        <div class="pack-wrap">
          <div id="packCard" class="pack-card">
            <div class="top">
              <div class="rating-bubble" id="packRating">--</div>
              <div class="position-pill" id="packPos">??</div>
            </div>
            <div class="art"></div>
            <div id="packName" class="card-name hidden">READY</div>
            <div class="small-meta">
              <span id="packRarity">Hidden</span>
              <span id="packClub">Club</span>
            </div>
            <div class="stats-grid">
              <div class="stat-cell"><div class="label">PAC</div><div class="val" id="s1">--</div></div>
              <div class="stat-cell"><div class="label">SHO</div><div class="val" id="s2">--</div></div>
              <div class="stat-cell"><div class="label">PAS</div><div class="val" id="s3">--</div></div>
              <div class="stat-cell"><div class="label">DRI</div><div class="val" id="s4">--</div></div>
              <div class="stat-cell"><div class="label">DEF</div><div class="val" id="s5">--</div></div>
              <div class="stat-cell"><div class="label">PHY</div><div class="val" id="s6">--</div></div>
            </div>
          </div>
        </div>

        <div class="controls">
          <button id="openBtn" class="spin">Open Pack</button>
          <button id="revealBtn" class="reveal-btn" disabled>Reveal</button>
          <button id="resetBtn" class="reset">Reset Collection</button>
          <div id="status" class="status">Pick a card type and open a pack.</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="section-title">Your Collection</div>
      <div id="collectionGrid" class="collection-grid"></div>
    </div>
  </div>

  <script>
    const cards = [
      { name:"Ethan", rating:80, position:"RB", rarity:"Bronze", club:"Pine", stats:[82,30,62,78,55,70] },
      { name:"Reuben", rating:80, position:"LB", rarity:"Bronze", club:"Pine", stats:[81,28,60,77,57,68] },
      { name:"Seb", rating:80, position:"CB", rarity:"Bronze", club:"Pine", stats:[62,20,50,58,84,76] },
      { name:"Ari", rating:98, position:"LW", rarity:"FUTTIES", club:"JTC", stats:[99,96,94,99,38,71] },
      { name:"James", rating:83, position:"ST", rarity:"Gold", club:"JTC", stats:[84,82,63,79,28,74] },
      { name:"Ben", rating:83, position:"ST", rarity:"Gold", club:"JTC", stats:[83,81,61,78,30,73] },
      { name:"Noah", rating:96, position:"CM", rarity:"JOGA BONITO", club:"JTC", stats:[97,85,96,98,44,75] },
      { name:"Donny", rating:82, position:"CM", rarity:"Silver", club:"JTC", stats:[79,68,80,80,52,68] },
      { name:"Charlie", rating:84, position:"ST", rarity:"Gold", club:"JTC", stats:[83,84,66,79,31,73] },
      { name:"Flynn", rating:80, position:"LM", rarity:"Bronze", club:"Pine", stats:[80,31,64,77,44,66] },
      { name:"Mason", rating:98, position:"CAM", rarity:"FUTTIES", club:"JTC", stats:[95,91,99,98,46,72] },
      { name:"Louis", rating:82, position:"RW", rarity:"Silver", club:"JTC", stats:[83,70,78,81,35,66] },
      { name:"Hugo", rating:81, position:"ST", rarity:"Silver", club:"JTC", stats:[82,77,65,77,26,68] },
      { name:"Lachlan", rating:81, position:"CB", rarity:"Silver", club:"Pine", stats:[60,18,49,56,82,73] },
      { name:"Harry L", rating:93, position:"CB", rarity:"TOTW", club:"JTC", stats:[65,34,64,68,92,88] },
      { name:"Martin", rating:98, position:"CDM", rarity:"FUTTIES", club:"JTC", stats:[89,84,90,92,97,96] },
      { name:"Luke", rating:96, position:"GK", rarity:"ICON GK", club:"JTC", stats:[18,12,28,24,96,88] },
      { name:"Jack", rating:85, position:"GK", rarity:"Gold", club:"JTC", stats:[24,14,35,27,85,78] },
      { name:"Archie", rating:82, position:"LB", rarity:"Silver", club:"Pine", stats:[81,29,67,79,53,69] },
      { name:"CJ", rating:82, position:"RB", rarity:"Silver", club:"Pine", stats:[83,32,66,80,54,70] },
      { name:"Harry R", rating:87, position:"CAM", rarity:"Gold", club:"JTC", stats:[84,78,88,87,42,72] },
      { name:"George", rating:80, position:"ST", rarity:"Bronze", club:"Pine", stats:[79,74,61,72,22,65] },
      { name:"Aidan", rating:85, position:"RM", rarity:"Gold", club:"JTC", stats:[86,78,82,83,40,70] },
      { name:"Fred", rating:81, position:"CAM", rarity:"Silver", club:"JTC", stats:[79,66,75,78,33,66] },
      { name:"Felix", rating:83, position:"CDM", rarity:"Gold", club:"JTC", stats:[72,58,78,76,80,77] },
      { name:"Gus", rating:80, position:"LB", rarity:"Bronze", club:"Pine", stats:[80,25,63,75,44,66] },
      { name:"Jack", rating:98, position:"GK", rarity:"GG", club:"JTC", stats:[25,18,30,24,98,86] },
      { name:"Gio", rating:84, position:"CB", rarity:"Gold", club:"JTC", stats:[64,24,59,61,83,77] }
    ];

    const rarityOrder = ["Bronze","Silver","Gold","TOTW","JOGA BONITO","ICON GK","FUTTIES","GG"];
    const rarityClass = {
      Bronze:"bronze-card", Silver:"silver-card", Gold:"gold-card", TOTW:"totw-card",
      "JOGA BONITO":"jb-card", "ICON GK":"icon-card", FUTTIES:"futties-card", GG:"gg-card"
    };

    const catalogGrid = document.getElementById("catalogGrid");
    const trackerGrid = document.getElementById("trackerGrid");
    const collectionGrid = document.getElementById("collectionGrid");
    const statusEl = document.getElementById("status");

    const packCard = document.getElementById("packCard");
    const packRating = document.getElementById("packRating");
    const packPos = document.getElementById("packPos");
    const packName = document.getElementById("packName");
    const packRarity = document.getElementById("packRarity");
    const packClub = document.getElementById("packClub");
    const statEls = ["s1","s2","s3","s4","s5","s6"].map(id => document.getElementById(id));

    const openBtn = document.getElementById("openBtn");
    const revealBtn = document.getElementById("revealBtn");
    const resetBtn = document.getElementById("resetBtn");

    let collection = new Set();
    let pendingCard = null;

    function key(c){ return `${c.name}|${c.position}|${c.rating}|${c.rarity}`; }

    function renderCatalog(){
      catalogGrid.innerHTML = "";
      cards.forEach(c => {
        const d = document.createElement("div");
        d.className = `mini-card ${rarityClass[c.rarity] || "gold-card"}`;
        d.innerHTML = `<div class="rarity">${c.rarity}</div><div class="name">${c.name}</div><div class="pos">${c.position}</div><div class="rating">${c.rating}</div>`;
        catalogGrid.appendChild(d);
      });
    }

    function renderTracker(){
      trackerGrid.innerHTML = "";
      rarityOrder.forEach(r => {
        const items = cards.filter(c => c.rarity === r);
        const have = items.filter(c => collection.has(key(c))).length;
        const box = document.createElement("div");
        box.className = "set-box";
        box.innerHTML = `<h3>${r}</h3><div class="count">${have}/${items.length}</div><div class="sub">${have === items.length ? "Completed" : "Still missing cards"}</div>`;
        trackerGrid.appendChild(box);
      });
    }

    function renderCollection(){
      collectionGrid.innerHTML = "";
      rarityOrder.forEach(r => {
        const items = cards.filter(c => c.rarity === r);
        if (!items.length) return;
        const have = items.filter(c => collection.has(key(c))).length;
        const box = document.createElement("div");
        box.className = "collection-item";
        box.innerHTML = `
          <div class="head">
            <div class="title">${r}</div>
            <div class="completion ${have===items.length ? "done" : "missing"}">${have}/${items.length}</div>
          </div>
          <ul>${items.map(c => `<li>${collection.has(key(c)) ? "✓" : "✕"} ${c.name} (${c.rating})</li>`).join("")}</ul>
        `;
        collectionGrid.appendChild(box);
      });
    }

    function resetPack(){
      packCard.className = "pack-card";
      packRating.textContent = "--";
      packPos.textContent = "??";
      packName.textContent = "READY";
      packName.classList.add("hidden");
      packRarity.textContent = "Hidden";
      packClub.textContent = "Club";
      statEls.forEach(el => el.textContent = "--");
    }

    function openPack(){
      pendingCard = cards[Math.floor(Math.random() * cards.length)];
      openBtn.disabled = true;
      revealBtn.disabled = false;
      statusEl.textContent = "Pack ready. Press Reveal.";
      resetPack();
    }

    function revealCard(){
      if (!pendingCard) return;
      const c = pendingCard;
      packCard.className = `pack-card ${rarityClass[c.rarity] || "gold-card"} reveal`;
      packRating.textContent = c.rating;
      packPos.textContent = c.position;
      packName.textContent = c.name.toUpperCase();
      packName.classList.remove("hidden");
      packRarity.textContent = c.rarity;
      packClub.textContent = c.club;
      statEls.forEach((el, i) => el.textContent = c.stats[i]);

      collection.add(key(c));
      renderTracker();
      renderCollection();

      statusEl.textContent = `Collected: ${c.name} (${c.rarity}).`;
      pendingCard = null;
      openBtn.disabled = false;
      revealBtn.disabled = true;
    }

    function resetCollection(){
      collection = new Set();
      renderTracker();
      renderCollection();
      resetPack();
      statusEl.textContent = "Collection reset.";
    }

    openBtn.addEventListener("click", openPack);
    revealBtn.addEventListener("click", revealCard);
    resetBtn.addEventListener("click", resetCollection);

    renderCatalog();
    renderTracker();
    renderCollection();
    resetPack();
  </script>
</body>
</html>
