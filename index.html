<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FUT Spins Style Draft</title>
  <style>
    :root{
      --bg:#2a2a2f;
      --panel:#3a4049;
      --panel2:#4a525d;
      --text:#ffffff;
      --muted:#d6d6d6;
      --green:#35a64a;
      --green-dark:#2a8540;
      --shadow:0 12px 24px rgba(0,0,0,.28);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background:
        linear-gradient(180deg, rgba(0,0,0,.08), rgba(0,0,0,.14)),
        radial-gradient(circle at 25% 20%, rgba(255,255,255,.06), transparent 20%),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,.04), transparent 24%),
        var(--bg);
      color:var(--text);
      min-height:100vh;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    .app{ width:min(1280px, calc(100% - 24px)); margin:0 auto; padding:14px 0 32px; }
    .title{ font-size:2.1rem; margin:0 0 14px; font-weight:800; letter-spacing:.02em; }

    .machine{
      position:relative;
      border-radius:18px;
      padding:14px;
      background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(0,0,0,.08));
    }

    .slot-row{ display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin-bottom:30px; background:#2f3138; border-radius:18px; padding:6px; box-shadow: inset 0 8px 18px rgba(255,255,255,.05), inset 0 -10px 18px rgba(0,0,0,.25); }
    .slot{ position:relative; height:126px; border-radius:14px; background:linear-gradient(180deg, #f7f7f7, #e5e5e5); color:#111; overflow:hidden; display:flex; align-items:center; justify-content:center; box-shadow: inset 0 10px 20px rgba(255,255,255,.7), inset 0 -10px 20px rgba(0,0,0,.12); }
    .slot::after{ content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(255,255,255,.9), transparent 22%, transparent 78%, rgba(0,0,0,.08)); pointer-events:none; }
    .slot-label{ position:absolute; top:8px; left:0; right:0; text-align:center; font-size:.76rem; font-weight:700; text-transform:uppercase; color:rgba(0,0,0,.45); letter-spacing:.06em; }
    .slot-value{ font-size:2.2rem; font-weight:900; line-height:1; z-index:1; text-align:center; padding:0 10px; }

    .main-area{ display:grid; grid-template-columns: 1fr 320px; gap:30px; align-items:start; padding:8px 4px 0; }
    .card-zone{ display:flex; justify-content:center; align-items:flex-start; min-height:520px; }

    /* Card: realistic look */
    .card{
      width:320px; height:470px; position:relative; border-radius:18px; overflow:hidden;
      background:linear-gradient(180deg,#2b3138 0%, #1f2428 100%);
      box-shadow: 0 20px 40px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.03), inset 0 -12px 30px rgba(0,0,0,.6);
      transition:transform .25s ease, box-shadow .25s ease, filter .25s ease;
      transform:translateZ(0); border:6px solid rgba(255,255,255,.03); padding:14px; display:flex; flex-direction:column; gap:6px;
    }

    /* metallic/foil rim */
    .card::before{
      content:''; position:absolute; inset:0; border-radius:16px; padding:3px;
      background:linear-gradient(90deg, rgba(255,255,255,.06), rgba(255,255,255,.02), rgba(0,0,0,.25));
      -webkit-mask: linear-gradient(#000, #000);
      pointer-events:none; z-index:0;
    }

    /* holographic sheen */
    .card::after{
      content:''; position:absolute; inset:0; border-radius:16px; pointer-events:none;
      background: conic-gradient(from 180deg at 50% 50%, rgba(255,255,255,0.02), rgba(255,255,255,0) 12%, rgba(255,255,255,0.02) 22%);
      mix-blend-mode:overlay; opacity:.9; z-index:2; filter:blur(6px);
    }

    .card-top{ position:relative; z-index:3; display:flex; justify-content:space-between; align-items:center; padding:4px 6px 0; font-weight:900; text-shadow:0 1px 0 rgba(255,255,255,.03); }

    /* rating badge */
    .rating-badge{
      position:relative; width:86px; height:86px; border-radius:50%;
      display:flex; align-items:center; justify-content:center; font-size:36px; font-weight:900; color:#1f1200;
      box-shadow:0 8px 18px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.5);
      border:3px solid rgba(255,255,255,.16);
      background:linear-gradient(180deg,#ffd86b,#ffb93b);
      z-index:4; overflow:hidden;
    }
    .rating-badge .shine{ position:absolute; inset:0; background:linear-gradient(120deg, rgba(255,255,255,.35), rgba(255,255,255,0)); transform:rotate(-20deg) translateX(-150%); animation:shimmer 2.4s linear infinite; opacity:.9; mix-blend-mode:overlay; }
    @keyframes shimmer{ 0%{ transform:rotate(-20deg) translateX(-150%); } 100%{ transform:rotate(-20deg) translateX(150%); } }

    /* rating colour per rarity */
    .card.gold .rating-badge{ background:linear-gradient(180deg,#fff7c7,#f7d07d); color:#2b1800; }
    .card.silver .rating-badge{ background:linear-gradient(180deg,#e6eef4,#b7c0c7); color:#13202a; }
    .card.bronze .rating-badge{ background:linear-gradient(180deg,#e0b08a,#8a5228); color:#fff; }
    .card.tots .rating-badge{ background:linear-gradient(180deg,#8ab1ff,#1f49d8); color:#fff; }
    .card.futties .rating-badge{ background:linear-gradient(180deg,#ff88c7,#c53a88); color:#fff; }
    .card.gg .rating-badge{ background:linear-gradient(180deg,#ffd86b,#b88b2b); color:#111; }

    /* position pill */
    .pos-pill{ background:rgba(0,0,0,.25); padding:6px 12px; border-radius:999px; font-weight:900; font-size:1rem; color:#fff; border:1px solid rgba(255,255,255,.06); z-index:3; }

    /* club & nation */
    .meta-row{ display:flex; gap:8px; align-items:center; padding:0 6px; z-index:3; }
    .club, .nation{ display:flex; align-items:center; gap:8px; }
    .club-badge, .nation-badge{ width:34px; height:34px; border-radius:6px; background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.2)); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.8rem; color:rgba(255,255,255,.95); border:1px solid rgba(255,255,255,.03); }
    .club-name{ font-size:.86rem; font-weight:700; letter-spacing:.03em; color:rgba(255,255,255,.95); }

    /* portrait / photo */
    .card-portrait{ position:relative; margin:6px 6px 6px; height:240px; border-radius:12px; overflow:hidden;
      background:linear-gradient(180deg, #0f1720 0%, #1b2228 100%); border:1px solid rgba(255,255,255,.04); box-shadow: inset 0 12px 40px rgba(0,0,0,.6);
      display:flex; align-items:center; justify-content:center; z-index:3; }
    .photo{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:72px; font-weight:900; color:rgba(255,255,255,.08); background-image: linear-gradient(135deg, rgba(255,255,255,.02) 0%, rgba(255,255,255,.01) 30%, rgba(0,0,0,.02) 100%), repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0 2px, transparent 2px 6px); position:relative; }
    /* subtle holographic strips */
    .photo::before{ content:''; position:absolute; inset:0; background:linear-gradient(90deg, rgba(255,255,255,.02) 0, rgba(255,255,255,0) 15%, rgba(255,255,255,.02) 35%, rgba(255,255,255,0) 60%); mix-blend-mode:overlay; opacity:.8; pointer-events:none; filter:blur(2px); }
    .photo-watermark{ position:absolute; right:10px; bottom:10px; font-weight:900; font-size:18px; color:rgba(255,255,255,.06); z-index:4; letter-spacing:.08em; text-transform:uppercase; }

    /* name + stats */
    .card-name{ position:relative; z-index:3; text-align:center; font-size:1.5rem; font-weight:800; text-transform:uppercase; margin:6px 6px 0; color:var(--text); letter-spacing:.06em; text-shadow:0 2px 6px rgba(0,0,0,.6); }
    .stats{ position:relative; z-index:3; display:grid; grid-template-columns:repeat(3, 1fr); gap:12px 10px; margin:8px 6px 0; padding-top:12px; border-top:1px solid rgba(255,255,255,.03); }
    .stat{ text-align:center; font-weight:800; color:rgba(255,255,255,.95); }
    .stat span{ display:block; font-size:.72rem; opacity:.95; margin-bottom:6px; letter-spacing:.05em; }
    .stat strong{ display:block; font-size:1.4rem; line-height:1; }

    /* rarity tinting (subtle overall card tint already handled) */
    .card.bronze{ background:linear-gradient(180deg,#3d2a20,#241811); }
    .card.silver{ background:linear-gradient(180deg,#dfe6ea,#aeb8bf); color:#111; }
    .card.gold{ background:linear-gradient(180deg,#fff7e6,#f7d89b); color:#2a1904; }
    .card.totw{ background:linear-gradient(180deg,#101827,#2b2f34); }
    .card.tots{ background:linear-gradient(180deg,#081032,#0d2b6a); }
    .card.futties{ background:linear-gradient(180deg,#521033,#2a0a2e); }
    .card.gg{ background:linear-gradient(180deg,#1b1b3a,#4b3b18); }

    /* history + controls trimmed (kept similar) */
    .history{ margin-top:26px; background:rgba(0,0,0,.12); border-radius:16px; padding:16px; }
    .history h2{ margin:0 0 12px; font-size:1.1rem; color:#fff; }
    .history-grid{ display:flex; flex-wrap:wrap; gap:10px; }
    .mini-card{ width:98px; border-radius:10px; background:#d2d6db; color:#111; padding:8px 6px; font-size:.72rem; font-weight:900; box-shadow: 0 8px 14px rgba(0,0,0,.18); }

    .controls{ display:flex; flex-direction:column; gap:12px; padding-top:18px; }
    .btn{ border:none; border-radius:8px; padding:18px 20px; font-size:1.3rem; font-weight:900; cursor:pointer; box-shadow: var(--shadow); transition:transform .18s ease, filter .18s ease, opacity .18s ease; text-transform:uppercase; }
    .btn:hover{ transform:translateY(-1px) } .btn:disabled{ opacity:.6; cursor:not-allowed; transform:none }
    .btn-spin{ background:linear-gradient(180deg, #44b85b, var(--green-dark)); color:white; height:116px; font-size:1.8rem; border-bottom:8px solid rgba(0,0,0,.12); }
    .btn-stop{ background:linear-gradient(180deg, #f3f3f3, #d9d9d9); color:#111; }
    .btn-reset{ background:linear-gradient(180deg, #ff6f6f, #d94a4a); color:white; }
    .status{ margin-top:14px; font-size:1rem; color:var(--muted); min-height:24px; }

    @media (max-width: 900px){ .main-area{ grid-template-columns:1fr } .controls{ max-width:420px; margin:0 auto } .card-zone{ min-height:unset } }
    @media (max-width: 720px){ .slot-row{ grid-template-columns:1fr } .slot{ height:88px } .slot-value{ font-size:1.6rem } .card{ width:min(300px,95vw); height:440px } .title{ font-size:1.7rem } .btn-spin{ height:92px } }
  </style>
</head>
<body>
  <div class="app">
    <h1 class="title">FUT Spins 26</h1>

    <div class="machine">
      <div class="slot-row">
        <div class="slot" id="slot-position">
          <div class="slot-label">Position</div>
          <div class="slot-value" id="slot-position-value">GK</div>
        </div>
        <div class="slot" id="slot-rarity">
          <div class="slot-label">Rarity</div>
          <div class="slot-value" id="slot-rarity-value">Bronze</div>
        </div>
        <div class="slot" id="slot-overall">
          <div class="slot-label">Overall</div>
          <div class="slot-value" id="slot-overall-value">40+</div>
        </div>
      </div>

      <div class="main-area">
        <div class="card-zone">
          <div id="card" class="card bronze">
            <div class="card-top">
              <div class="rating-badge" id="card-rating">
                40
                <div class="shine"></div>
              </div>
              <div class="pos-pill" id="card-pos">GK</div>
            </div>

            <div class="meta-row">
              <div class="club">
                <div class="club-badge">FC</div>
                <div class="club-name" id="club-name">CLUB</div>
              </div>
              <div style="flex:1"></div>
              <div class="nation">
                <div class="nation-badge">GB</div>
              </div>
            </div>

            <div class="card-portrait">
              <div class="photo" id="portrait-mark">FUT
                <div class="photo-watermark" id="photo-watermark">FUT</div>
              </div>
            </div>

            <div class="card-name" id="card-name">READY</div>

            <div class="stats">
              <div class="stat"><span>PAC</span><strong id="stat-pac">--</strong></div>
              <div class="stat"><span>SHO</span><strong id="stat-sho">--</strong></div>
              <div class="stat"><span>PAS</span><strong id="stat-pas">--</strong></div>
              <div class="stat"><span>DRI</span><strong id="stat-dri">--</strong></div>
              <div class="stat"><span>DEF</span><strong id="stat-def">--</strong></div>
              <div class="stat"><span>PHY</span><strong id="stat-phy">--</strong></div>
            </div>
          </div>
        </div>

        <div class="controls">
          <button id="spin-btn" class="btn btn-spin">SPIN!</button>
          <button id="stop-btn" class="btn btn-stop" disabled>STOP</button>
          <button id="reset-btn" class="btn btn-reset">RESET</button>
          <div class="status" id="status">Press Spin to start.</div>
        </div>
      </div>
    </div>

    <div class="history">
      <h2>Packed Squad History</h2>
      <div id="history-grid" class="history-grid"></div>
    </div>
  </div>

  <script>
    const roster = [
      { name:"Ethan", rating:80, position:"RB" },
      { name:"Reuben", rating:80, position:"LB" },
      { name:"Seb", rating:80, position:"CB" },
      { name:"Ari", rating:87, position:"LW" },
      { name:"James", rating:83, position:"ST" },
      { name:"Ben", rating:83, position:"ST" },
      { name:"Noah", rating:81, position:"CM" },
      { name:"Donny", rating:82, position:"CM" },
      { name:"Charlie", rating:84, position:"ST" },
      { name:"Flynn", rating:80, position:"LM" },
      { name:"Mason", rating:86, position:"CAM" },
      { name:"Louis", rating:82, position:"RW" },
      { name:"Hugo", rating:81, position:"ST" },
      { name:"Lachlan", rating:81, position:"CB" },
      { name:"Harry L", rating:82, position:"CB" },
      { name:"Martin", rating:86, position:"CDM" },
      { name:"Luke", rating:82, position:"GK" },
      { name:"Jack", rating:85, position:"GK" },
      { name:"Archie", rating:80, position:"LB" },
      { name:"CJ", rating:90, position:"RB" },
      { name:"Harry R", rating:87, position:"CAM" },
      { name:"George", rating:80, position:"ST" },
      { name:"Aidan", rating:85, position:"RM" },
      { name:"Fred", rating:81, position:"CAM" },
      { name:"Felix", rating:83, position:"CDM" },
      { name:"Gus", rating:80, position:"LB" },
      { name:"Jack", rating:98, position:"GK" }
    ];

    const spinBtn = document.getElementById("spin-btn");
    const stopBtn = document.getElementById("stop-btn");
    const resetBtn = document.getElementById("reset-btn");
    const statusEl = document.getElementById("status");

    const slotPositionValue = document.getElementById("slot-position-value");
    const slotRarityValue = document.getElementById("slot-rarity-value");
    const slotOverallValue = document.getElementById("slot-overall-value");

    const card = document.getElementById("card");
    const cardRating = document.getElementById("card-rating");
    const cardPos = document.getElementById("card-pos");
    const cardName = document.getElementById("card-name");
    const portraitMark = document.getElementById("portrait-mark");
    const statPac = document.getElementById("stat-pac");
    const statSho = document.getElementById("stat-sho");
    const statPas = document.getElementById("stat-pas");
    const statDri = document.getElementById("stat-dri");
    const statDef = document.getElementById("stat-def");
    const statPhy = document.getElementById("stat-phy");
    const historyGrid = document.getElementById("history-grid");
    const clubName = document.getElementById("club-name");
    const photoWatermark = document.getElementById("photo-watermark");

    const positions = ["GK","CB","LB","RB","CM","CDM","CAM","LM","RM","LW","RW","ST"];
    const rarities = ["Bronze","Silver","Gold","TOTW","TOTS","FUTTIES","GG"];
    const rarityClasses = {
      Bronze: "bronze",
      Silver: "silver",
      Gold: "gold",
      TOTW: "totw",
      TOTS: "tots",
      FUTTIES: "futties",
      GG: "gg"
    };

    let currentStage = 0;
    let spinning = false;
    let intervalId = null;
    let currentPick = null;
    let currentPosition = "GK";
    let currentRarity = "Bronze";

    function getRarity(player) {
      if (player.name === "Jack" && player.position === "GK" && player.rating >= 98) return "GG";
      if (player.rating >= 99) return "FUTTIES";
      if (player.rating >= 96) return "TOTS";
      if (player.rating >= 93) return "TOTW";
      if (player.rating >= 85) return "Gold";
      if (player.rating >= 80) return "Silver";
      return "Bronze";
    }

    function statsFor(rating, rarity) {
      if (rarity === "GG") {
        return [20, 10, 30, 15, 98, 82];
      }

      const boost = {
        Bronze:  [-10,-12,-10,-11,-14,-10],
        Silver:  [-6,-7,-6,-6,-9,-6],
        Gold:    [-2,-3,-2,-2,-5,-2],
        TOTW:    [2,1,0,1,-2,0],
        TOTS:    [6,5,4,5,2,4],
        FUTTIES: [8,7,6,7,4,6]
      }[rarity] || [0,0,0,0,0,0];

      return boost.map(b => Math.max(25, Math.min(99, rating + b)));
    }

    function randomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function updateCard(player, rarityOverride = null) {
      const rarity = rarityOverride || getRarity(player);
      currentPick = player;
      currentRarity = rarity;
      currentPosition = player.position;

      // apply class for subtle tinting
      card.className = `card ${rarityClasses[rarity] || "gold"}`;

      // rating badge
      cardRating.textContent = player.rating;

      // position pill
      cardPos.textContent = player.position;

      // name
      cardName.textContent = player.name.toUpperCase();

      // watermark (subtle FUT/GG)
      photoWatermark.textContent = rarity === "GG" ? "GG" : "FUT";

      const [pac, sho, pas, dri, def, phy] = statsFor(player.rating, rarity);
      statPac.textContent = pac;
      statSho.textContent = sho;
      statPas.textContent = pas;
      statDri.textContent = dri;
      statDef.textContent = def;
      statPhy.textContent = phy;

      slotPositionValue.textContent = player.position;
      slotRarityValue.textContent = rarity;
      slotOverallValue.textContent = player.rating >= 90 ? `${player.rating}+` : `${player.rating}`;

      // small club demo text
      clubName.textContent = player.name.length > 6 ? player.name.slice(0,6).toUpperCase() : player.name.toUpperCase();

      // tint portrait background a bit depending on rarity
      const photo = document.querySelector('.photo');
      if(photo) {
        if(rarity === 'Gold' || rarity === 'FUTTIES' || rarity === 'TOTS') {
          photo.style.backgroundImage = 'linear-gradient(135deg, rgba(255,255,255,.02), rgba(0,0,0,.06)), repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0 2px, transparent 2px 6px)';
        } else if(rarity === 'Silver') {
          photo.style.backgroundImage = 'linear-gradient(135deg, rgba(255,255,255,.03), rgba(0,0,0,.04))';
        } else if(rarity === 'GG') {
          photo.style.backgroundImage = 'linear-gradient(135deg, rgba(255,255,255,.01), rgba(0,0,0,.16))';
        } else {
          photo.style.backgroundImage = 'linear-gradient(135deg, rgba(255,255,255,.01), rgba(0,0,0,.06))';
        }
      }
    }

    function addToHistory(player, rarity) {
      const item = document.createElement("div");
      item.className = `mini-card ${rarityClasses[rarity] || "gold"}`;
      item.innerHTML = `
        <div class="mini-pos">${player.position}</div>
        <div class="mini-rating">${player.rating}</div>
        <div class="mini-name">${player.name}</div>
      `;
      historyGrid.prepend(item);
    }

    function resetGame() {
      currentStage = 0; spinning = false; currentPick = null; clearInterval(intervalId); intervalId = null;
      currentPosition = "GK"; currentRarity = "Bronze";
      slotPositionValue.textContent = "GK"; slotRarityValue.textContent = "Bronze"; slotOverallValue.textContent = "40+";
      updateCard({ name:"READY", rating:40, position:"GK" }, "Bronze");
      statusEl.textContent = "Press Spin to start."; spinBtn.disabled = false; stopBtn.disabled = true; spinBtn.textContent = "SPIN!";
    }

    function startSpin() {
      if (spinning) return;
      spinning = true; spinBtn.disabled = true; stopBtn.disabled = false;
      statusEl.textContent = currentStage === 0 ? "Spin position..." : currentStage === 1 ? "Spin rarity..." : "Spin player...";
      clearInterval(intervalId);
      intervalId = setInterval(() => {
        if (currentStage === 0) slotPositionValue.textContent = randomItem(positions);
        else if (currentStage === 1) slotRarityValue.textContent = randomItem(rarities);
        else { const p = randomItem(roster); slotOverallValue.textContent = p.rating >= 90 ? `${p.rating}+` : `${p.rating}`; }
      }, 70);
    }

    function stopSpin() {
      if (!spinning) return;
      clearInterval(intervalId); intervalId = null; spinning = false; stopBtn.disabled = true; spinBtn.disabled = false;

      if (currentStage === 0) {
        const pos = randomItem(positions); currentPosition = pos; slotPositionValue.textContent = pos;
        statusEl.textContent = `Position locked: ${pos}. Press Spin again.`; currentStage = 1; return;
      }

      if (currentStage === 1) {
        let pool = roster.filter(p => p.position === currentPosition); if (!pool.length) pool = roster;
        const player = randomItem(pool); const rarity = getRarity(player); currentRarity = rarity;
        slotRarityValue.textContent = rarity; updateCard(player, rarity);
        statusEl.textContent = `Rarity locked: ${rarity}. Press Spin again.`; currentStage = 2; return;
      }

      if (currentStage === 2) {
        let pool = roster.filter(p => p.position === currentPosition);
        if (currentRarity === "GG") pool = roster.filter(p => p.name === "Jack" && p.position === "GK" && p.rating >= 98);
        else pool = pool.filter(p => getRarity(p) === currentRarity);
        if (!pool.length) pool = roster;
        const player = randomItem(pool); const rarity = getRarity(player);
        updateCard(player, rarity); addToHistory(player, rarity);
        statusEl.textContent = `Packed ${player.name} (${player.rating} - ${player.position})`; currentStage = 0; return;
      }
    }

    spinBtn.addEventListener("click", startSpin);
    stopBtn.addEventListener("click", stopSpin);
    resetBtn.addEventListener("click", resetGame);

    resetGame();
  </script>
</body>
</html>
