<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FC-Style Pack Draft</title>
  <style>
    :root{
      --bg:#0a0f1a;
      --panel:rgba(14,18,28,.88);
      --text:#f8fafc;
      --muted:rgba(255,255,255,.72);
      --gold:#f6d37a;
      --shadow:0 18px 40px rgba(0,0,0,.35);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Segoe UI, Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top, rgba(94,111,255,.18), transparent 30%),
        radial-gradient(circle at 20% 20%, rgba(250,204,21,.08), transparent 18%),
        linear-gradient(180deg,#111827,var(--bg));
      min-height:100vh;
    }

    .app{
      width:min(1120px, calc(100% - 20px));
      margin:0 auto;
      padding:22px 0 40px;
    }

    .topbar{
      text-align:center;
      margin-bottom:18px;
    }

    .tag{
      display:inline-block;
      padding:6px 12px;
      border-radius:999px;
      background:rgba(246,211,122,.08);
      border:1px solid rgba(246,211,122,.25);
      color:var(--gold);
      text-transform:uppercase;
      letter-spacing:.08em;
      font-size:.8rem;
    }

    h1{
      margin:12px 0 8px;
      font-size:clamp(2rem,4vw,3.25rem);
    }

    .topbar p{
      margin:0;
      color:var(--muted);
    }

    .controls{
      display:grid;
      grid-template-columns:120px 1fr;
      gap:14px;
      background:var(--panel);
      border:1px solid rgba(255,255,255,.08);
      border-radius:18px;
      padding:16px;
      box-shadow:var(--shadow);
      margin-bottom:18px;
      backdrop-filter: blur(10px);
    }

    .controls label{
      display:flex;
      flex-direction:column;
      gap:8px;
      color:var(--muted);
      font-size:.9rem;
    }

    .controls input{
      width:100%;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.05);
      color:white;
      border-radius:12px;
      padding:12px 14px;
      font:inherit;
    }

    .button-row{
      grid-column:1 / -1;
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }

    .btn{
      border:none;
      border-radius:12px;
      padding:12px 18px;
      font-weight:800;
      cursor:pointer;
      transition:transform .18s ease, opacity .18s ease, box-shadow .18s ease;
    }

    .btn:hover{transform:translateY(-1px)}
    .btn:disabled{cursor:not-allowed; opacity:.55; transform:none}

    .btn.primary{
      background:linear-gradient(135deg,#f6d37a,#d0a94a);
      color:#1a1407;
    }

    .btn.secondary{
      background:rgba(255,255,255,.08);
      color:white;
    }

    .btn.danger{
      background:#ef4444;
      color:white;
    }

    .arena{
      display:grid;
      gap:14px;
      justify-items:center;
      margin-bottom:18px;
    }

    .slot-shell{
      position:relative;
      width:100%;
      overflow:hidden;
      border-radius:18px;
      border:2px solid rgba(246,211,122,.2);
      background:linear-gradient(180deg, rgba(8,12,20,.96), rgba(4,6,10,.98));
      box-shadow:inset 0 0 32px rgba(0,0,0,.75), 0 16px 36px rgba(0,0,0,.35);
      padding:14px 0;
    }

    .slot-window{
      position:relative;
      width:min(860px,100%);
      height:182px;
      margin:0 auto;
      overflow:hidden;
      border-top:2px solid rgba(255,255,255,.06);
      border-bottom:2px solid rgba(255,255,255,.06);
    }

    .slot-window::before,
    .slot-window::after{
      content:"";
      position:absolute;
      top:0;
      bottom:0;
      width:80px;
      z-index:3;
      pointer-events:none;
    }

    .slot-window::before{
      left:0;
      background:linear-gradient(90deg, rgba(4,6,10,1), rgba(4,6,10,0));
    }

    .slot-window::after{
      right:0;
      background:linear-gradient(270deg, rgba(4,6,10,1), rgba(4,6,10,0));
    }

    .center-line{
      position:absolute;
      left:50%;
      top:0;
      transform:translateX(-50%);
      width:182px;
      height:100%;
      border-left:2px dashed rgba(255,100,100,.34);
      border-right:2px dashed rgba(255,100,100,.34);
      background:rgba(255,255,255,.02);
      z-index:2;
      pointer-events:none;
    }

    .reel-track{
      display:flex;
      align-items:center;
      gap:14px;
      padding:20px 46px;
      transform:translateX(0);
      will-change:transform;
    }

    .reel-card{
      width:180px;
      height:138px;
      border-radius:18px;
      padding:12px 12px 10px;
      flex:0 0 auto;
      position:relative;
      overflow:hidden;
      border:2px solid rgba(255,255,255,.14);
      box-shadow:0 10px 20px rgba(0,0,0,.3);
      transform:scale(.965);
      transition:transform .18s ease, filter .18s ease;
    }

    .reel-card.active{
      transform:scale(1.08);
      filter:brightness(1.12) saturate(1.08);
    }

    .reel-card .rarity{
      position:absolute;
      top:10px;
      right:10px;
      font-size:.66rem;
      font-weight:900;
      letter-spacing:.12em;
      text-transform:uppercase;
      padding:5px 8px;
      border-radius:999px;
      background:rgba(0,0,0,.24);
      color:white;
    }

    .reel-card .rating{
      font-size:2.7rem;
      font-weight:900;
      line-height:1;
      color:#fff;
      text-shadow:0 2px 10px rgba(0,0,0,.35);
    }

    .reel-card .name{
      margin-top:8px;
      font-size:1rem;
      font-weight:900;
      text-transform:uppercase;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .reel-card .pos{
      margin-top:4px;
      font-size:.78rem;
      opacity:.9;
      letter-spacing:.04em;
    }

    .result{
      width:100%;
      text-align:center;
      padding:14px 16px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.05);
      color:var(--gold);
      font-weight:800;
    }

    .card-zone{
      display:grid;
      place-items:center;
      margin-bottom:18px;
    }

    .player-card{
      position:relative;
      width:min(360px,94vw);
      aspect-ratio:.72 / 1;
      border-radius:30px;
      overflow:hidden;
      border:3px solid rgba(255,255,255,.15);
      padding:18px;
      transform-style:preserve-3d;
      transition:transform .25s ease, box-shadow .25s ease;
      animation:floatCard 4s ease-in-out infinite;
      clip-path: polygon(10% 0%, 90% 0%, 100% 7%, 100% 93%, 90% 100%, 10% 100%, 0% 93%, 0% 7%);
    }

    .player-card::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 20% 15%, rgba(255,255,255,.2), transparent 18%),
        radial-gradient(circle at 80% 20%, rgba(255,255,255,.12), transparent 18%),
        linear-gradient(135deg, rgba(255,255,255,.06), transparent 40%);
      pointer-events:none;
    }

    .card-top{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      z-index:1;
    }

    .card-rating{
      font-size:clamp(4rem,11vw,5.5rem);
      font-weight:900;
      line-height:.9;
      color:var(--gold);
      text-shadow:0 2px 14px rgba(0,0,0,.35);
    }

    .card-pos{
      font-size:1.8rem;
      font-weight:900;
      letter-spacing:.06em;
      color:rgba(255,255,255,.95);
    }

    .card-art{
      position:relative;
      height:52%;
      margin:12px 0 10px;
      border-radius:22px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.1);
      background:radial-gradient(circle at 50% 20%, rgba(255,255,255,.16), transparent 28%), linear-gradient(135deg, #0f1633, #101b4d 45%, #06101f 100%);
    }

    .card-art::before,
    .card-art::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(135deg, transparent 35%, rgba(246,211,122,.25) 35%, rgba(246,211,122,.25) 38%, transparent 38%),
        linear-gradient(155deg, transparent 50%, rgba(246,211,122,.18) 50%, rgba(246,211,122,.18) 53%, transparent 53%);
      opacity:.8;
    }

    .card-glow{
      position:absolute;
      inset:-10%;
      background:
        radial-gradient(circle at 35% 45%, rgba(64,114,255,.7), transparent 28%),
        radial-gradient(circle at 70% 55%, rgba(255,214,102,.55), transparent 26%);
      filter:blur(12px);
      animation:glowMove 5s ease-in-out infinite;
    }

    .card-badge{
      position:absolute;
      top:12px;
      right:12px;
      padding:6px 10px;
      border-radius:999px;
      background:rgba(246,211,122,.16);
      border:1px solid rgba(246,211,122,.35);
      color:var(--gold);
      font-size:.75rem;
      font-weight:800;
      letter-spacing:.14em;
    }

    .card-name{
      z-index:1;
      text-align:center;
      font-size:1.7rem;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.06em;
      margin-top:4px;
    }

    .stats{
      z-index:1;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px 12px;
      margin-top:auto;
      padding-top:12px;
    }

    .stats div{
      display:flex;
      flex-direction:column;
      gap:4px;
      align-items:center;
    }

    .stats span{
      font-size:.8rem;
      color:rgba(255,255,255,.72);
      font-weight:700;
    }

    .stats strong{
      font-size:2rem;
      color:white;
      line-height:1;
    }

    .history{
      margin-top:20px;
      padding:16px;
      border-radius:18px;
      background:var(--panel);
      border:1px solid rgba(255,255,255,.08);
      backdrop-filter:blur(10px);
    }

    .history h2{
      margin:0 0 14px;
      color:var(--gold);
    }

    .history-grid{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      justify-content:center;
    }

    .history-mini-card{
      width:112px;
      padding:10px 8px;
      border-radius:14px;
      border:2px solid rgba(255,255,255,.16);
      color:white;
      font-weight:800;
      box-shadow:0 8px 18px rgba(0,0,0,.3);
      animation:popIn .25s ease-out;
    }

    .history-mini-card .mini-card-rating{
      font-size:1.8rem;
      line-height:1;
      margin:4px 0;
    }

    .history-mini-card .mini-card-name{
      font-size:.72rem;
      text-transform:uppercase;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .history-mini-card .mini-card-pos{
      font-size:.68rem;
      opacity:.85;
    }

    .skin-bronze{background:linear-gradient(135deg,#8b4b21,#4b240c) !important; box-shadow:0 0 28px rgba(139,75,33,.45)}
    .skin-silver{background:linear-gradient(135deg,#dbe4ef,#aeb9c8) !important; color:#18212f !important}
    .skin-gold{background:linear-gradient(135deg,#ffec8a,#c58a18) !important; box-shadow:0 0 30px rgba(246,211,122,.35)}
    .skin-totw{background:linear-gradient(135deg,#111827,#fbbf24,#fde68a) !important; box-shadow:0 0 28px rgba(251,191,36,.45)}
    .skin-special{background:linear-gradient(135deg,#4c1d95,#7c3aed,#22d3ee) !important; box-shadow:0 0 30px rgba(124,58,237,.45)}
    .skin-tots{background:linear-gradient(135deg,#10163c,#1e4fd8,#0d8e83) !important; box-shadow:0 0 32px rgba(53,99,255,.55); animation:cardPulse 1.7s ease-in-out infinite, floatCard 4s ease-in-out infinite}
    .skin-futties{background:linear-gradient(135deg,#f43f8c,#c51f6b,#16b7d4) !important; box-shadow:0 0 38px rgba(244,63,140,.65); animation:cardPulse 1.2s ease-in-out infinite, floatCard 4s ease-in-out infinite}

    @keyframes floatCard{0%,100%{translate:0 0}50%{translate:0 -6px}}
    @keyframes cardPulse{0%,100%{filter:brightness(1); transform:scale(1)}50%{filter:brightness(1.08); transform:scale(1.01)}}
    @keyframes glowMove{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(6px,-8px,0) scale(1.05)}}
    @keyframes popIn{from{transform:scale(.85); opacity:0}to{transform:scale(1); opacity:1}}

    @media (max-width:760px){
      .controls{grid-template-columns:1fr}
      .button-row{flex-direction:column}
      .btn{width:100%}
      .slot-window{height:160px}
      .reel-card{width:155px; height:128px}
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="tag">Dynamic Pack Draft</div>
      <h1>Pack Spinner</h1>
      <p>Press Spin to start, Stop to lock each stage, then reveal your final card.</p>
    </header>

    <section class="controls">
      <label>
        Position
        <input id="filter-pos" type="text" value="ST" maxlength="3" />
      </label>

      <div class="button-row">
        <button id="btn-spin" class="btn primary">Spin</button>
        <button id="btn-stop" class="btn secondary" disabled>Stop</button>
        <button id="clear-history-btn" class="btn danger">Reset History</button>
      </div>
    </section>

    <section class="arena">
      <div class="slot-shell">
        <div class="slot-window">
          <div class="center-line"></div>
          <div id="reel-track" class="reel-track"></div>
        </div>
      </div>

      <div class="result">
        <div id="result-text">Ready for pack selection</div>
      </div>
    </section>

    <section class="card-zone">
      <article id="display-card" class="player-card skin-silver">
        <div class="card-top">
          <div class="card-rating" id="card-rating">--</div>
          <div class="card-pos" id="card-pos">ST</div>
        </div>

        <div class="card-art">
          <div class="card-glow"></div>
          <div class="card-badge" id="card-badge">DRAFT</div>
        </div>

        <div class="card-name" id="card-name">READY</div>

        <div class="stats">
          <div><span>PAC</span><strong id="stat-pac">--</strong></div>
          <div><span>SHO</span><strong id="stat-sho">--</strong></div>
          <div><span>PAS</span><strong id="stat-pas">--</strong></div>
          <div><span>DRI</span><strong id="stat-dri">--</strong></div>
          <div><span>DEF</span><strong id="stat-def">--</strong></div>
          <div><span>PHY</span><strong id="stat-phy">--</strong></div>
        </div>
      </article>
    </section>

    <section class="history">
      <h2>Packed Squad History</h2>
      <div id="history-ledger" class="history-grid">
        <p id="history-fallback-msg">No players drafted yet. Press spin to build your squad!</p>
      </div>
    </section>
  </main>

  <script>
    const roster = [
      "Ethan (84 - RB)","Reuben (84 - LB)","Seb (90 - CB)","Ari (97 - LW)","James (92 - ST)",
      "Ben (92 - ST)","Noah (91 - CM)","Donny (92 - CM)","Charlie (94 - ST)","Flynn (90 - LM)",
      "Mason (96 - CAM)","Louis (92 - RW)","Hugo (91 - ST)","Lachlan (91 - CB)","Harry L (92 - CB)",
      "Martin (96 - CDM)","Luke (92 - GK)","Jack (95 - GK)","Archie (90 - LB)","CJ (100 - RB)",
      "Harry R (97 - CAM)","George (90 - ST)","Aidan (95 - RM)","Fred (91 - CAM)","Felix (93 - CDM)"
    ];

    const reelTrack = document.getElementById("reel-track");
    const resultText = document.getElementById("result-text");
    const spinBtn = document.getElementById("btn-spin");
    const stopBtn = document.getElementById("btn-stop");
    const displayCard = document.getElementById("display-card");
    const cardName = document.getElementById("card-name");
    const cardRating = document.getElementById("card-rating");
    const cardPos = document.getElementById("card-pos");
    const cardBadge = document.getElementById("card-badge");
    const historyLedger = document.getElementById("history-ledger");
    const clearHistoryBtn = document.getElementById("clear-history-btn");
    const filterPosInput = document.getElementById("filter-pos");

    const statPac = document.getElementById("stat-pac");
    const statSho = document.getElementById("stat-sho");
    const statPas = document.getElementById("stat-pas");
    const statDri = document.getElementById("stat-dri");
    const statDef = document.getElementById("stat-def");
    const statPhy = document.getElementById("stat-phy");

    let items = [];
    let currentOffset = 0;
    let isReeling = false;
    let stopRequested = false;
    let animationId = null;
    let step = 208;

    let stage = 0;
    let stageResult = null;
    let spinState = "idle";

    function parseRoster(list) {
      return [...list];
    }

    function parseEntry(entry) {
      const match = entry.match(/^(.+?)\s*\((\d+)\s*-\s*([^)]+)\)$/);
      if (!match) return { name: entry, rating: 75, position: filterPosInput.value.toUpperCase() };
      return { name: match[1].trim(), rating: parseInt(match[2], 10), position: match[3].trim().toUpperCase() };
    }

    function getRarity(rating) {
      if (rating >= 99) return "FUTTIES";
      if (rating >= 96) return "TOTS";
      if (rating >= 93) return "SPECIAL";
      if (rating >= 90) return "TOTW";
      if (rating >= 85) return "GOLD";
      if (rating >= 80) return "SILVER";
      return "BRONZE";
    }

    function rarityToSkin(rarity) {
      return {
        BRONZE: "skin-bronze",
        SILVER: "skin-silver",
        GOLD: "skin-gold",
        TOTW: "skin-totw",
        SPECIAL: "skin-special",
        TOTS: "skin-tots",
        FUTTIES: "skin-futties"
      }[rarity] || "skin-silver";
    }

    function statsFor(rating, rarity) {
      const base = rating;
      const boost = {
        BRONZE: [-10, -12, -10, -11, -14, -10],
        SILVER: [-6, -7, -6, -6, -9, -6],
        GOLD: [-2, -3, -2, -2, -5, -2],
        TOTW: [2, 1, 0, 1, -2, 0],
        SPECIAL: [4, 3, 2, 3, 0, 2],
        TOTS: [6, 5, 4, 5, 2, 4],
        FUTTIES: [8, 7, 6, 7, 4, 6]
      }[rarity] || [0,0,0,0,0,0];

      return [
        Math.max(30, Math.min(99, base + boost[0])),
        Math.max(25, Math.min(99, base + boost[1])),
        Math.max(25, Math.min(99, base + boost[2])),
        Math.max(25, Math.min(99, base + boost[3])),
        Math.max(20, Math.min(99, base + boost[4])),
        Math.max(25, Math.min(99, base + boost[5]))
      ];
    }

    function buildReel() {
      reelTrack.innerHTML = "";
      if (!items.length) return;

      const total = 33;
      const start = Math.floor(total / 2);

      for (let i = 0; i < total; i++) {
        const entry = parseEntry(items[i % items.length]);
        const rarity = getRarity(entry.rating);
        const card = document.createElement("div");
        card.className = `reel-card ${rarityToSkin(rarity)}`;
        card.innerHTML = `
          <div class="rarity">${rarity}</div>
          <div class="rating">${entry.rating}</div>
          <div class="name">${entry.name}</div>
          <div class="pos">${entry.position}</div>
        `;
        reelTrack.appendChild(card);
      }

      currentOffset = -(start * step);
      reelTrack.style.transform = `translateX(${currentOffset}px)`;
      highlightCenterCard();
    }

    function highlightCenterCard() {
      const cards = [...document.querySelectorAll(".reel-card")];
      if (!cards.length) return;

      const centerX = window.innerWidth / 2;
      let closest = null;
      let best = Infinity;

      cards.forEach(c => c.classList.remove("active"));

      cards.forEach(card => {
        const rect = card.getBoundingClientRect();
        const dist = Math.abs((rect.left + rect.width / 2) - centerX);
        if (dist < best) {
          best = dist;
          closest = card;
        }
      });

      if (closest) closest.classList.add("active");
    }

    function setDisplay(name, rating, position, rarity) {
      cardName.textContent = name;
      cardRating.textContent = rating;
      cardPos.textContent = position;
      cardBadge.textContent = rarity;
      displayCard.className = `player-card ${rarityToSkin(rarity)}`;

      const [pac, sho, pas, dri, def, phy] = statsFor(rating, rarity);
      statPac.textContent = pac;
      statSho.textContent = sho;
      statPas.textContent = pas;
      statDri.textContent = dri;
      statDef.textContent = def;
      statPhy.textContent = phy;
    }

    function addHistory(name, rating, position, rarity) {
      const fallback = document.getElementById("history-fallback-msg");
      if (fallback) fallback.remove();

      const mini = document.createElement("div");
      mini.className = `history-mini-card ${rarityToSkin(rarity)}`;
      mini.innerHTML = `
        <div class="mini-card-pos">${position}</div>
        <div class="mini-card-rating">${rating}</div>
        <div class="mini-card-name">${name}</div>
      `;
      historyLedger.insertBefore(mini, historyLedger.firstChild);
    }

    function clearHistory() {
      historyLedger.innerHTML = `<p id="history-fallback-msg">No players drafted yet. Press spin to build your squad!</p>`;
    }

    function moveToIndex(index, duration = 1700) {
      return new Promise(resolve => {
        const start = currentOffset;
        const target = -(index * step);
        const begin = performance.now();

        function easeOutQuint(t) {
          return 1 - Math.pow(1 - t, 5);
        }

        function frame(now) {
          const t = Math.min(1, (now - begin) / duration);
          currentOffset = start + (target - start) * easeOutQuint(t);
          reelTrack.style.transform = `translateX(${currentOffset}px)`;
          highlightCenterCard();

          if (t < 1) {
            animationId = requestAnimationFrame(frame);
          } else {
            resolve();
          }
        }

        if (animationId) cancelAnimationFrame(animationId);
        animationId = requestAnimationFrame(frame);
      });
    }

    function randomPick() {
      return items[Math.floor(Math.random() * items.length)];
    }

    async function spin() {
      if (isReeling || !items.length) return;

      isReeling = true;
      stopRequested = false;
      spinState = "spinning";
      stage = 1;
      stageResult = null;

      spinBtn.textContent = "Spinning";
      stopBtn.disabled = false;
      resultText.textContent = "Rolling... press Stop to lock";

      let velocity = 2.6 + Math.random() * 1.4;

      function continuousRoll() {
        if (!isReeling || stopRequested) return;
        currentOffset -= velocity;
        velocity = Math.min(24, velocity + 0.25);
        reelTrack.style.transform = `translateX(${currentOffset}px)`;
        highlightCenterCard();
        animationId = requestAnimationFrame(continuousRoll);
      }

      if (animationId) cancelAnimationFrame(animationId);
      animationId = requestAnimationFrame(continuousRoll);
    }

    async function stop() {
      if (!isReeling) return;

      stopRequested = true;
      if (animationId) cancelAnimationFrame(animationId);

      const parsed = items.map(parseEntry);

      if (stage === 1) {
        const chosen = parsed[Math.floor(Math.random() * parsed.length)];
        const ovr = Math.max(80, Math.min(99, chosen.rating + Math.floor(Math.random() * 4 - 1)));
        const targetIndex = parsed.findIndex(p => p.name === chosen.name && p.rating === chosen.rating);
        await moveToIndex(targetIndex >= 0 ? targetIndex : 0, 1200);

        setDisplay("???", ovr, filterPosInput.value.toUpperCase(), getRarity(ovr));
        resultText.textContent = `OVR locked: ${ovr}`;
        stageResult = { ovr };
        stage = 2;
        isReeling = true;
        stopRequested = false;
        spinBtn.textContent = "Spin";
        stopBtn.disabled = false;
        return;
      }

      if (stage === 2) {
        const rarityRoll = randomPick();
        const rarity = getRarity(parseEntry(rarityRoll).rating);

        const pool = parsed.filter(p => getRarity(p.rating) === rarity);
        const chosen = pool.length ? pool[Math.floor(Math.random() * pool.length)] : randomPick();
        const targetIndex = parsed.findIndex(p => p.name === chosen.name && p.rating === chosen.rating);
        await moveToIndex(targetIndex >= 0 ? targetIndex : 0, 1200);

        setDisplay("???", stageResult?.ovr ?? chosen.rating, "??", rarity);
        resultText.textContent = `Rarity locked: ${rarity}`;
        stageResult = { ...stageResult, rarity };
        stage = 3;
        isReeling = true;
        stopRequested = false;
        spinBtn.textContent = "Spin";
        stopBtn.disabled = false;
        return;
      }

      if (stage === 3) {
        const rarity = stageResult?.rarity || "GOLD";
        const pool = parsed.filter(p => getRarity(p.rating) === rarity);
        const chosen = pool.length ? pool[Math.floor(Math.random() * pool.length)] : randomPick();
        const targetIndex = parsed.findIndex(p => p.name === chosen.name && p.rating === chosen.rating);

        await moveToIndex(targetIndex >= 0 ? targetIndex : 0, 1400);

        const finalData = parseEntry(items[targetIndex >= 0 ? targetIndex : 0]);
        const finalRarity = getRarity(finalData.rating);
        setDisplay(finalData.name, finalData.rating, finalData.position, finalRarity);
        resultText.textContent = `Packed: ${finalData.name} (${finalData.rating} - ${finalData.position})`;
        addHistory(finalData.name, finalData.rating, finalData.position, finalRarity);

        isReeling = false;
        stopRequested = false;
        stage = 0;
        spinBtn.textContent = "Spin";
        stopBtn.disabled = true;
      }
    }

    function init() {
      items = parseRoster(roster);
      buildReel();

      const first = parseEntry(items[0]);
      setDisplay(first.name, first.rating, filterPosInput.value.toUpperCase(), getRarity(first.rating));

      spinBtn.addEventListener("click", spin);
      stopBtn.addEventListener("click", stop);
      clearHistoryBtn.addEventListener("click", clearHistory);

      filterPosInput.addEventListener("input", () => {
        if (!isReeling) cardPos.textContent = filterPosInput.value.toUpperCase();
      });

      window.addEventListener("resize", highlightCenterCard);
    }

    init();
  </script>
</body>
</html>
