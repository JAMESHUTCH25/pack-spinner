<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pack Draft Reveal</title>
  <style>
    :root{
      --bg:#0b1020;
      --panel:rgba(17,24,39,.88);
      --text:#f8fafc;
      --muted:rgba(255,255,255,.72);
      --gold:#f7d77a;
      --shadow:0 18px 40px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Segoe UI,Arial,sans-serif;
      color:var(--text);
      min-height:100vh;
      background:
        radial-gradient(circle at top, rgba(82,118,255,.18), transparent 28%),
        radial-gradient(circle at 20% 20%, rgba(250,204,21,.08), transparent 18%),
        linear-gradient(180deg,#111827,#0b1020);
    }
    .app{width:min(1140px, calc(100% - 20px)); margin:0 auto; padding:22px 0 40px}
    .topbar{text-align:center; margin-bottom:18px}
    .tag{
      display:inline-block; padding:6px 12px; border-radius:999px;
      background:rgba(246,211,122,.08); border:1px solid rgba(246,211,122,.25);
      color:var(--gold); text-transform:uppercase; letter-spacing:.08em; font-size:.8rem;
    }
    h1{margin:12px 0 8px; font-size:clamp(2rem,4vw,3.25rem)}
    .topbar p{margin:0; color:var(--muted)}

    .controls{
      display:grid;
      grid-template-columns: 1fr auto;
      gap:14px;
      background:var(--panel);
      border:1px solid rgba(255,255,255,.08);
      border-radius:18px;
      padding:16px;
      box-shadow:var(--shadow);
      margin-bottom:18px;
      backdrop-filter: blur(10px);
      align-items:center;
    }

    .slot-3{
      display:grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap:8px;
      width:100%;
    }

    .slot-box{
      background:linear-gradient(180deg, #f7f7f7, #e6e6e6);
      color:#111;
      border-radius:18px;
      border:1px solid rgba(0,0,0,.12);
      height:110px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      box-shadow: inset 0 10px 18px rgba(255,255,255,.75), inset 0 -10px 18px rgba(0,0,0,.12);
      position:relative;
      overflow:hidden;
    }
    .slot-box .slot-label{
      position:absolute;
      top:8px;
      left:0;
      right:0;
      text-align:center;
      font-size:.75rem;
      font-weight:900;
      letter-spacing:.08em;
      text-transform:uppercase;
      opacity:.7;
    }
    .slot-box .slot-value{
      font-size:2rem;
      font-weight:900;
      line-height:1;
      margin-top:10px;
    }
    .slot-box.spin-flash{
      animation: flash .12s linear infinite alternate;
    }
    @keyframes flash{
      from{filter:brightness(1)}
      to{filter:brightness(1.18)}
    }

    .button-row{
      display:flex;
      flex-direction:column;
      gap:10px;
      min-width:170px;
    }

    .btn{
      border:none;
      border-radius:12px;
      padding:16px 18px;
      font-weight:900;
      cursor:pointer;
      transition:transform .18s ease, opacity .18s ease, box-shadow .18s ease;
      width:100%;
    }
    .btn:hover{transform:translateY(-1px)}
    .btn:disabled{cursor:not-allowed; opacity:.55; transform:none}
    .btn.primary{background:linear-gradient(135deg,#2ecc71,#1f9d55); color:white}
    .btn.secondary{background:rgba(255,255,255,.08); color:white}
    .btn.danger{background:#ef4444; color:white}

    .arena{
      display:grid;
      gap:14px;
      justify-items:center;
      margin-bottom:18px;
    }

    .result{
      width:100%;
      text-align:center;
      padding:14px 16px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.05);
      color:var(--gold);
      font-weight:800;
      min-height:52px;
    }

    .card-zone{
      display:grid;
      place-items:center;
      margin-bottom:18px;
    }

    .player-card{
      position:relative;
      width:min(360px,94vw);
      aspect-ratio:.72 / 1;
      border-radius:30px;
      overflow:hidden;
      border:3px solid rgba(255,255,255,.15);
      padding:18px;
      transform-style:preserve-3d;
      transition:transform .25s ease, box-shadow .25s ease;
      animation:floatCard 4s ease-in-out infinite;
      clip-path: polygon(10% 0%, 90% 0%, 100% 7%, 100% 93%, 90% 100%, 10% 100%, 0% 93%, 0% 7%);
    }

    .player-card::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 20% 15%, rgba(255,255,255,.2), transparent 18%),
        radial-gradient(circle at 80% 20%, rgba(255,255,255,.12), transparent 18%),
        linear-gradient(135deg, rgba(255,255,255,.06), transparent 40%);
      pointer-events:none;
    }

    .card-top{display:flex; align-items:baseline; justify-content:space-between; z-index:1}
    .card-rating{
      font-size:clamp(4rem,11vw,5.5rem);
      font-weight:900;
      line-height:.9;
      color:var(--gold);
      text-shadow:0 2px 14px rgba(0,0,0,.35);
    }
    .card-pos{
      font-size:1.8rem;
      font-weight:900;
      letter-spacing:.06em;
      color:rgba(255,255,255,.95);
    }

    .card-art{
      position:relative;
      height:52%;
      margin:12px 0 10px;
      border-radius:22px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.1);
      background:radial-gradient(circle at 50% 20%, rgba(255,255,255,.16), transparent 28%), linear-gradient(135deg, #0f1633, #101b4d 45%, #06101f 100%);
    }
    .card-art::before,.card-art::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(135deg, transparent 35%, rgba(246,211,122,.25) 35%, rgba(246,211,122,.25) 38%, transparent 38%),
        linear-gradient(155deg, transparent 50%, rgba(246,211,122,.18) 50%, rgba(246,211,122,.18) 53%, transparent 53%);
      opacity:.8;
    }
    .card-glow{
      position:absolute;
      inset:-10%;
      background:
        radial-gradient(circle at 35% 45%, rgba(64,114,255,.7), transparent 28%),
        radial-gradient(circle at 70% 55%, rgba(255,214,102,.55), transparent 26%);
      filter:blur(12px);
      animation:glowMove 5s ease-in-out infinite;
    }
    .card-badge{
      position:absolute;
      top:12px;
      right:12px;
      padding:6px 10px;
      border-radius:999px;
      background:rgba(246,211,122,.16);
      border:1px solid rgba(246,211,122,.35);
      color:var(--gold);
      font-size:.75rem;
      font-weight:800;
      letter-spacing:.14em;
    }
    .card-name{
      z-index:1;
      text-align:center;
      font-size:1.7rem;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.06em;
      margin-top:4px;
    }
    .stats{
      z-index:1;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px 12px;
      margin-top:auto;
      padding-top:12px;
    }
    .stats div{
      display:flex;
      flex-direction:column;
      gap:4px;
      align-items:center;
    }
    .stats span{
      font-size:.8rem;
      color:rgba(255,255,255,.72);
      font-weight:700;
    }
    .stats strong{
      font-size:1.8rem;
      color:white;
      line-height:1;
    }

    .history{
      margin-top:20px;
      padding:16px;
      border-radius:18px;
      background:var(--panel);
      border:1px solid rgba(255,255,255,.08);
      backdrop-filter:blur(10px);
    }
    .history h2{margin:0 0 14px; color:var(--gold)}
    .history-grid{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      justify-content:center;
    }
    .history-mini-card{
      width:112px;
      padding:10px 8px;
      border-radius:14px;
      border:2px solid rgba(255,255,255,.16);
      color:white;
      font-weight:800;
      box-shadow:0 8px 18px rgba(0,0,0,.3);
      animation:popIn .25s ease-out;
    }
    .history-mini-card .mini-card-rating{
      font-size:1.8rem;
      line-height:1;
      margin:4px 0;
    }
    .history-mini-card .mini-card-name{
      font-size:.72rem;
      text-transform:uppercase;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .history-mini-card .mini-card-pos{
      font-size:.68rem;
      opacity:.85;
    }

    .skin-bronze{background:linear-gradient(135deg,#8b4b21,#4b240c) !important; box-shadow:0 0 28px rgba(139,75,33,.45)}
    .skin-silver{background:linear-gradient(135deg,#dbe4ef,#aeb9c8) !important; color:#18212f !important}
    .skin-gold{background:linear-gradient(135deg,#ffec8a,#c58a18) !important; box-shadow:0 0 30px rgba(246,211,122,.35)}
    .skin-totw{background:linear-gradient(135deg,#111827,#fbbf24,#fde68a) !important; box-shadow:0 0 28px rgba(251,191,36,.45)}
    .skin-special{background:linear-gradient(135deg,#4c1d95,#7c3aed,#22d3ee) !important; box-shadow:0 0 30px rgba(124,58,237,.45)}
    .skin-tots{background:linear-gradient(135deg,#10163c,#1e4fd8,#0d8e83) !important; box-shadow:0 0 32px rgba(53,99,255,.55); animation:cardPulse 1.7s ease-in-out infinite, floatCard 4s ease-in-out infinite}
    .skin-futties{background:linear-gradient(135deg,#f43f8c,#c51f6b,#16b7d4) !important; box-shadow:0 0 38px rgba(244,63,140,.65); animation:cardPulse 1.2s ease-in-out infinite, floatCard 4s ease-in-out infinite}
    @keyframes floatCard{0%,100%{translate:0 0}50%{translate:0 -6px}}
    @keyframes cardPulse{0%,100%{filter:brightness(1); transform:scale(1)}50%{filter:brightness(1.08); transform:scale(1.01)}}
    @keyframes glowMove{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(6px,-8px,0) scale(1.05)}}
    @keyframes popIn{from{transform:scale(.85); opacity:0}to{transform:scale(1); opacity:1}}

    @media (max-width:760px){
      .controls{grid-template-columns:1fr; justify-items:stretch}
      .slot-3{grid-template-columns:1fr}
      .button-row{flex-direction:column; min-width:unset}
      .btn{width:100%}
      .stats strong{font-size:1.55rem}
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="tag">Dynamic Pack Draft</div>
      <h1>Pack Spinner</h1>
      <p>Stop each panel, then reveal the card. Player rating stays true to the player.</p>
    </header>

    <section class="controls">
      <div class="slot-3">
        <div class="slot-box" id="slot-position">
          <div class="slot-label">Position</div>
          <div class="slot-value" id="slot-position-value">ST</div>
        </div>
        <div class="slot-box" id="slot-rarity">
          <div class="slot-label">Rarity</div>
          <div class="slot-value" id="slot-rarity-value">Bronze</div>
        </div>
        <div class="slot-box" id="slot-rating">
          <div class="slot-label">Overall</div>
          <div class="slot-value" id="slot-rating-value">40+</div>
        </div>
      </div>

      <div class="button-row">
        <button id="btn-spin" class="btn primary">Spin</button>
        <button id="btn-stop" class="btn secondary" disabled>Stop</button>
        <button id="clear-history-btn" class="btn danger">Reset History</button>
      </div>
    </section>

    <section class="card-zone">
      <article id="display-card" class="player-card skin-silver">
        <div class="card-top">
          <div class="card-rating" id="card-rating">--</div>
          <div class="card-pos" id="card-pos">ST</div>
        </div>

        <div class="card-art">
          <div class="card-glow"></div>
          <div class="card-badge" id="card-badge">DRAFT</div>
        </div>

        <div class="card-name" id="card-name">READY</div>

        <div class="stats">
          <div><span>PAC</span><strong id="stat-pac">--</strong></div>
          <div><span>SHO</span><strong id="stat-sho">--</strong></div>
          <div><span>PAS</span><strong id="stat-pas">--</strong></div>
          <div><span>DRI</span><strong id="stat-dri">--</strong></div>
          <div><span>DEF</span><strong id="stat-def">--</strong></div>
          <div><span>PHY</span><strong id="stat-phy">--</strong></div>
        </div>
      </article>
    </section>

    <section class="history">
      <h2>Packed Squad History</h2>
      <div id="history-ledger" class="history-grid">
        <p id="history-fallback-msg">No players drafted yet. Press spin to build your squad!</p>
      </div>
    </section>
  </main>

  <script>
    const roster = [
      "Ethan (84 - RB)","Reuben (84 - LB)","Seb (90 - CB)","Ari (97 - LW)","James (92 - ST)",
      "Ben (92 - ST)","Noah (91 - CM)","Donny (92 - CM)","Charlie (94 - ST)","Flynn (90 - LM)",
      "Mason (96 - CAM)","Louis (92 - RW)","Hugo (91 - ST)","Lachlan (91 - CB)","Harry L (92 - CB)",
      "Martin (96 - CDM)","Luke (92 - GK)","Jack (95 - GK)","Archie (90 - LB)","CJ (100 - RB)",
      "Harry R (97 - CAM)","George (90 - ST)","Aidan (95 - RM)","Fred (91 - CAM)","Felix (93 - CDM)"
    ];

    const slotPosition = document.getElementById("slot-position");
    const slotRarity = document.getElementById("slot-rarity");
    const slotRating = document.getElementById("slot-rating");
    const slotPositionValue = document.getElementById("slot-position-value");
    const slotRarityValue = document.getElementById("slot-rarity-value");
    const slotRatingValue = document.getElementById("slot-rating-value");

    const spinBtn = document.getElementById("btn-spin");
    const stopBtn = document.getElementById("btn-stop");
    const clearHistoryBtn = document.getElementById("clear-history-btn");

    const displayCard = document.getElementById("display-card");
    const cardName = document.getElementById("card-name");
    const cardRating = document.getElementById("card-rating");
    const cardPos = document.getElementById("card-pos");
    const cardBadge = document.getElementById("card-badge");
    const historyLedger = document.getElementById("history-ledger");

    const statPac = document.getElementById("stat-pac");
    const statSho = document.getElementById("stat-sho");
    const statPas = document.getElementById("stat-pas");
    const statDri = document.getElementById("stat-dri");
    const statDef = document.getElementById("stat-def");
    const statPhy = document.getElementById("stat-phy");

    let items = [...roster];
    let stage = 0;
    let spinning = false;
    let stopRequested = false;
    let currentChoice = null;
    let currentTheme = "GOLD";
    let intervalId = null;
    let lastIndex = 0;

    const positions = ["GK", "CB", "LB", "RB", "CM", "CDM", "CAM", "LM", "RM", "LW", "RW", "ST"];
    const rarities = ["Bronze", "Silver", "Gold", "TOTW", "Special", "TOTS", "FUTTIES"];

    function parseEntry(entry) {
      const m = entry.match(/^(.+?)\s*\((\d+)\s*-\s*([^)]+)\)$/);
      return m ? { name:m[1].trim(), rating:parseInt(m[2],10), position:m[3].trim().toUpperCase() } : { name:entry, rating:75, position:"ST" };
    }

    function getRarity(rating) {
      if (rating >= 99) return "FUTTIES";
      if (rating >= 96) return "TOTS";
      if (rating >= 93) return "Special";
      if (rating >= 90) return "TOTW";
      if (rating >= 85) return "Gold";
      if (rating >= 80) return "Silver";
      return "Bronze";
    }

    function raritySkin(rarity) {
      return {
        Bronze:"skin-bronze",
        Silver:"skin-silver",
        Gold:"skin-gold",
        TOTW:"skin-totw",
        Special:"skin-special",
        TOTS:"skin-tots",
        FUTTIES:"skin-futties"
      }[rarity] || "skin-silver";
    }

    function statsFor(rating, rarity) {
      const boost = {
        Bronze:[-10,-12,-10,-11,-14,-10],
        Silver:[-6,-7,-6,-6,-9,-6],
        Gold:[-2,-3,-2,-2,-5,-2],
        TOTW:[2,1,0,1,-2,0],
        Special:[4,3,2,3,0,2],
        TOTS:[6,5,4,5,2,4],
        FUTTIES:[8,7,6,7,4,6]
      }[rarity] || [0,0,0,0,0,0];
      return boost.map(b => Math.max(25, Math.min(99, rating + b)));
    }

    function updateSlotText(stageIndex, value) {
      if (stageIndex === 1) {
        slotPositionValue.textContent = value;
        slotPosition.classList.add("spin-flash");
        setTimeout(() => slotPosition.classList.remove("spin-flash"), 700);
      }
      if (stageIndex === 2) {
        slotRarityValue.textContent = value;
        slotRarity.classList.add("spin-flash");
        setTimeout(() => slotRarity.classList.remove("spin-flash"), 700);
      }
      if (stageIndex === 3) {
        slotRatingValue.textContent = value;
        slotRating.classList.add("spin-flash");
        setTimeout(() => slotRating.classList.remove("spin-flash"), 700);
      }
    }

    function randomChoice(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function pickPlayerForPosition(pos) {
      const pool = items.map(parseEntry).filter(p => p.position === pos);
      return pool.length ? randomChoice(pool) : parseEntry(randomChoice(items));
    }

    function pickPlayerForRarity(rarity) {
      const pool = items.map(parseEntry).filter(p => getRarity(p.rating) === rarity);
      return pool.length ? randomChoice(pool) : parseEntry(randomChoice(items));
    }

    function applyCard(data) {
      const rarity = getRarity(data.rating);
      displayCard.className = `player-card ${raritySkin(rarity)}`;
      cardName.textContent = data.name;
      cardRating.textContent = data.rating;
      cardPos.textContent = data.position;
      cardBadge.textContent = rarity.toUpperCase();
      const [pac, sho, pas, dri, def, phy] = statsFor(data.rating, rarity);
      statPac.textContent = pac;
      statSho.textContent = sho;
      statPas.textContent = pas;
      statDri.textContent = dri;
      statDef.textContent = def;
      statPhy.textContent = phy;
    }

    function addHistory(data) {
      const rarity = getRarity(data.rating);
      const fallback = document.getElementById("history-fallback-msg");
      if (fallback) fallback.remove();
      const mini = document.createElement("div");
      mini.className = `history-mini-card ${raritySkin(rarity)}`;
      mini.innerHTML = `
        <div class="mini-card-pos">${data.position}</div>
        <div class="mini-card-rating">${data.rating}</div>
        <div class="mini-card-name">${data.name}</div>
      `;
      historyLedger.insertBefore(mini, historyLedger.firstChild);
    }

    function clearHistory() {
      historyLedger.innerHTML = `<p id="history-fallback-msg">No players drafted yet. Press spin to build your squad!</p>`;
    }

    function stopSpinLoop() {
      if (intervalId) clearInterval(intervalId);
      intervalId = null;
      spinning = false;
      stopBtn.disabled = true;
      spinBtn.disabled = false;
      spinBtn.textContent = "Spin";
    }

    function beginSpinLoop() {
      stopSpinLoop();
      spinning = true;
      spinBtn.disabled = true;
      stopBtn.disabled = false;
      spinBtn.textContent = "Spinning";

      let i = lastIndex;
      intervalId = setInterval(() => {
        const data = parseEntry(items[i % items.length]);
        if (stage === 1) {
          slotPositionValue.textContent = data.position;
        } else if (stage === 2) {
          slotRarityValue.textContent = getRarity(data.rating).toUpperCase();
        } else if (stage === 3) {
          slotRatingValue.textContent = data.rating;
        }
        i++;
        lastIndex = i;
      }, 85);
    }

    function getStageTarget(stageNumber) {
      const parsed = items.map(parseEntry);
      if (stageNumber === 1) return randomChoice(positions);
      if (stageNumber === 2) return randomChoice(rarities);
      if (stageNumber === 3) return randomChoice(parsed);
      return null;
    }

    function startSpin() {
      if (spinning) return;
      if (stage === 0) {
        currentChoice = null;
        currentTheme = "GOLD";
      }
      stage = Math.min(stage + 1, 3);
      beginSpinLoop();
      resultText.textContent = stage === 1 ? "Spinning position..." : stage === 2 ? "Spinning rarity..." : "Spinning player...";
      if (stage === 1) updateSlotText(1, "...");
      if (stage === 2) updateSlotText(2, "...");
      if (stage === 3) updateSlotText(3, "...");
    }

    function stopSpin() {
      if (!spinning) return;

      if (stage === 1) {
        const pos = getStageTarget(1);
        const chosen = pickPlayerForPosition(pos);
        currentChoice = chosen;
        updateSlotText(1, pos);
        currentTheme = getRarity(chosen.rating);
        applyCard({ ...chosen });
        resultText.textContent = `Position locked: ${pos}`;
        stopSpinLoop();
        return;
      }

      if (stage === 2) {
        const rarity = getStageTarget(2);
        const chosen = pickPlayerForRarity(rarity);
        currentChoice = chosen;
        currentTheme = rarity;
        updateSlotText(2, rarity.toUpperCase());
        applyCard({ ...chosen });
        resultText.textContent = `Rarity locked: ${rarity.toUpperCase()}`;
        stopSpinLoop();
        return;
      }

      if (stage === 3) {
        const chosen = currentChoice || getStageTarget(3);
        updateSlotText(3, String(chosen.rating));
        applyCard(chosen);
        resultText.textContent = `Packed: ${chosen.name} (${chosen.rating} - ${chosen.position})`;
        addHistory(chosen);
        stopSpinLoop();
        stage = 0;
        currentChoice = null;
        return;
      }
    }

    items = [...roster];
    const first = parseEntry(items[0]);
    applyCard(first);
    slotPositionValue.textContent = "ST";
    slotRarityValue.textContent = "Bronze";
    slotRatingValue.textContent = "40+";

    spinBtn.addEventListener("click", startSpin);
    stopBtn.addEventListener("click", stopSpin);
    clearHistoryBtn.addEventListener("click", clearHistory);
  </script>
</body>
</html>
